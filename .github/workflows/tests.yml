name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test, with coverage of the package
        run: python -m pytest -q --cov=fish_morpho --cov-report=term
      - name: The documented commands run on a clean clone, without photographs
        run: |
          python scripts/export_measurements.py --dataset cornell --out results/ci/measurements.xlsx
          python scripts/export_tps.py --sidecars data/cornell/sidecars --images data/cornell/lateral --out results/ci/tps
          python scripts/caliper_check.py
