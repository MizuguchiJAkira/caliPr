<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caliPr — Trout Labeler</title>
<style>
  :root { --bg:#12151a; --panel:#1b2029; --line:#2b3340; --fg:#e6ebf2; --mut:#8a97a8;
          --accent:#4aa3ff; --good:#37c871; --warn:#ffb454; --kp:#ff5d6c; --ruler:#c07bff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  /* Wider by default, and draggable: the sidebar carries the landmark list, the
     image controls and the key, and 290px cramped all three. */
  /* Three columns. The landmark list and the specimen list were both flex:1 in
     one sidebar and starved each other -- the specimen list ended up showing
     three rows. Separate columns let each have its own full height. */
  #app { display:grid;
    grid-template-columns:var(--sidew,320px) 6px var(--taskw,240px) 6px 1fr;
    grid-template-rows:100%; height:100vh; max-height:100vh; overflow:hidden; }
  #taskcol { background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; }
  .colhdr { font-size:10px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--mut); padding:12px 14px 8px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px; }
  #taskcount { margin-left:auto; font-variant-numeric:tabular-nums; }
  #hideex { display:flex; align-items:center; gap:4px; cursor:pointer;
    text-transform:none; letter-spacing:0; font-size:10px; }
  /* Struck through rather than removed: an excluded landmark is a decision, and
     a decision you cannot see is one you cannot revisit. */
  .task.excluded .nm { text-decoration:line-through; opacity:.45; }
  .task.excluded .dot { background:transparent; box-shadow:inset 0 0 0 1px var(--mut); }
  .task .ex { flex:none; width:14px; text-align:center; color:var(--mut);
    opacity:0; font-size:11px; }
  .task:hover .ex, .task.excluded .ex { opacity:1; }
  .task .ex:hover { color:var(--warn); }
  #grip, #grip2 { background:var(--line); cursor:col-resize; }
  #grip:hover, #grip.drag, #grip2:hover, #grip2.drag { background:var(--accent); }
  body.resizing { cursor:col-resize; user-select:none; }
  #side { background:var(--panel); border-right:1px solid var(--line); display:flex;
    flex-direction:column; min-height:0; }
  #side h1 { font-size:14px; margin:0; padding:12px 14px; border-bottom:1px solid var(--line);
    letter-spacing:.3px; }
  #side h1 small { color:var(--mut); font-weight:400; }
  .sec { padding:10px 14px; border-bottom:1px solid var(--line); }
  .sec h2 { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut);
    margin:0 0 8px; }
  #specWrap { overflow:auto; flex:1; min-height:120px; }
  .spec { padding:5px 14px; cursor:pointer; display:flex; justify-content:space-between;
    gap:6px; border-left:3px solid transparent; }
  .spec:hover { background:#232a35; }
  .spec.active { background:#26303d; border-left-color:var(--accent); }
  .mk { display:inline-block; width:15px; height:15px; line-height:15px; text-align:center;
    border-radius:3px; font-size:10px; font-weight:700; margin-left:3px;
    background:#2b3340; color:#59657a; }
  .mk.on { background:var(--good); color:#052; }
  .mk.f.on { background:#c07bff; color:#1a0033; }
  .mk.v.on { background:var(--good); color:#052; }
  .mk.v.thin { background:var(--warn); color:#2a1a00; }
  .mk.h.on { background:var(--accent); color:#04121f; }
  .mk.s.on { background:#ffd166; color:#3a2a00; }
  #progress .mk { margin-left:6px; margin-right:2px; }
  .spec .st { color:var(--mut); font-size:11px; }
  .spec.done .st { color:var(--good); }
  .pickers { display:flex; gap:8px; margin-bottom:8px; }
  .pickers label { flex:1; display:flex; flex-direction:column; gap:3px;
    font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--mut); }
  .pickers select { background:#0e1218; color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:5px 6px; font-size:12px; }
  /* Collapsed by default: a key is looked at once and then never again, so it
     should not hold five lines of a sidebar that is already tight. */
  /* The key and the progress are the same five rows, so they are one block: the
     badge explains itself and its own count sits against the right edge. */
  #legend .lr { display:grid; grid-template-columns:auto 1fr auto; align-items:center;
    gap:6px; padding:1px 0; }
  #legend .lr .n { font-variant-numeric:tabular-nums; color:var(--fg); font-weight:600; }
  #legendbox { border-bottom:1px solid var(--line); font-size:10.5px; color:var(--mut); }
  #legendbox summary { cursor:pointer; list-style:none; padding:6px 14px;
    text-transform:uppercase; letter-spacing:.5px; font-size:10px; }
  #legendbox summary::-webkit-details-marker { display:none; }
  #legendbox summary::before { content:'▸ '; }
  #legendbox[open] summary::before { content:'▾ '; }
  #legend { padding:0 14px 8px; line-height:1.9; }
  #legend .mk { margin-left:0; margin-right:5px; }
  button { background:#28303c; color:var(--fg); border:1px solid var(--line); border-radius:6px;
    padding:6px 9px; cursor:pointer; font-size:12px; }
  button:hover { background:#313b49; }
  button.on { background:var(--accent); border-color:var(--accent); color:#04121f; font-weight:600; }
  button.primary { background:var(--good); border-color:var(--good); color:#052; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  /* Grouped and collapsible, the landmark list is a few rows tall, so it sizes to
     its content instead of claiming half a column. Capped so a fully expanded set
     still cannot squeeze the specimen list out. */
  #tasks { overflow:auto; flex:1; min-height:0; }
  .task { display:flex; align-items:center; gap:7px; padding:2px 14px; cursor:pointer;
    border-left:3px solid transparent; font-size:12px; line-height:1.5; }
  .task:hover { background:#232a35; }
  .task.active { background:#26303d; border-left-color:var(--accent); }
  .task .dot { width:9px; height:9px; border-radius:50%; background:#3a4553; flex:none; }
  .task.set .dot { background:var(--good); }
  .task .nm { flex:1; }
  .task .kind { color:var(--mut); font-size:10px; text-transform:uppercase; }
  /* vertex counter for fin outlines: amber until the outline is dense enough */
  .task .cnt { font-size:10px; font-variant-numeric:tabular-nums; color:var(--mut);
               background:#232a35; border-radius:3px; padding:1px 5px; flex:none; }
  .task.thin .dot { background:var(--warn); }
  .task.thin .cnt { color:#2a1a00; background:var(--warn); font-weight:600; }
  .task.set .cnt { color:#052; background:var(--good); font-weight:600; }
  #hint { padding:9px 14px; background:#161b22; color:var(--mut); border-bottom:1px solid var(--line);
    min-height:52px; max-height:132px; overflow:auto; flex:none; font-size:12px; }
  #hint b { color:var(--fg); }
  #cal { display:flex; align-items:center; gap:6px; }
  #cal input { width:70px; background:#0e1218; border:1px solid var(--line); color:var(--fg);
    border-radius:5px; padding:4px 6px; }
  #autocal { display:flex; align-items:center; gap:7px; margin-top:6px; }
  #autocal button { padding:3px 8px; font-size:11px; }
  #autotxt { font-size:11px; color:var(--mut); font-variant-numeric:tabular-nums; }
  #calread { margin-top:6px; font-size:11px; color:var(--mut); font-variant-numeric:tabular-nums; }
  #calread.warn { color:#04121f; background:var(--warn); border-radius:4px; padding:3px 6px; font-weight:600; }
  /* Stacked, not side by side: two range inputs in a 290px sidebar overflowed by
     136px and ran the brightness slider off the edge of the panel. */
  #imgpanel { margin-top:8px; font-size:11px; color:var(--mut); }
  #imgpanel summary { cursor:pointer; list-style:none; padding:3px 0;
    text-transform:uppercase; letter-spacing:.5px; font-size:10px; }
  #imgpanel summary::-webkit-details-marker { display:none; }
  #imgpanel summary::before { content:'▸ '; }
  #imgpanel[open] summary::before { content:'▾ '; }
  #imgstate { color:var(--warn); text-transform:none; letter-spacing:0; }
  #autostat { margin-top:6px; font-size:11px; color:var(--mut); line-height:1.4; }
  #autostat b { color:var(--warn); }
  .task .conf { font-size:10px; padding:0 4px; border-radius:3px; margin-left:4px;
                background:#ffb45426; color:var(--warn); }
  #imgctrl { display:flex; flex-direction:column; gap:5px; margin-top:6px; }
  #imgctrl label { display:flex; flex-direction:column; gap:2px; width:100%; }
  #imgctrl label b { color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums; }
  #imgctrl input[type=range] { width:100%; accent-color:var(--accent); }
  .imgbtns { display:flex; gap:5px; margin-top:3px; }
  .imgbtns button { flex:1; padding:3px 6px; font-size:10.5px; }
  .imgbtns button.on { background:var(--accent); border-color:var(--accent);
    color:#04121f; font-weight:600; }
  /* Last-resort guard: if the sidebar ever outgrows the window, scroll it rather
     than silently clipping a control off the bottom. */
  #side { overflow-y:auto; }
  #rtsec { padding:8px 14px; }
  #rtstat { margin-top:6px; font-size:11px; color:var(--mut); line-height:1.5; }
  #rtstat b { color:var(--fg); }
  #rtstat .fin { display:inline-block; margin-right:8px; }
  #rtstat .fin.ok { color:var(--good); }
  #rtstat .fin.thin { color:var(--warn); }
  body.retrace #rtoggle { background:var(--accent); border-color:var(--accent);
                          color:#04121f; font-weight:600; }
  /* Regions collapse, and a finished one collapses itself. 28 landmarks in one
     flat column is a tall list for a task that advances automatically — you look
     at the region you are working, not all of them. */
  .grouphdr { padding:6px 14px 2px; font-size:9.5px; text-transform:uppercase;
              letter-spacing:.6px; color:var(--mut);
              display:flex; align-items:center; gap:6px; }
  .grouphdr .gn { flex:1; }
  .grouphdr .gc { font-variant-numeric:tabular-nums; }
  .grouphdr.done .gc { color:var(--good); }
  /* Collapsible like the others: a compromise note is occasional, and 92px of
     permanent chrome was coming out of the specimen list. The summary shows a
     marker when the open specimen actually has one, so it is not hidden. */
  #exportbox { padding:8px 14px; border-bottom:1px solid var(--line); }
  #exportbox summary { cursor:pointer; list-style:none; padding:2px 0;
    text-transform:uppercase; letter-spacing:.5px; font-size:10px; color:var(--mut); }
  #exportbox summary::-webkit-details-marker { display:none; }
  #exportbox summary::before { content:'▸ '; }
  #exportbox[open] summary::before { content:'▾ '; }
  #expstate { color:var(--warn); text-transform:none; letter-spacing:0; }
  .exprow { margin-top:6px; }
  .exprow button { width:100%; }
  .exprow span { display:block; font-size:10px; color:var(--mut); margin-top:2px; }
  #dcsec { padding:8px 14px; border-bottom:1px solid var(--line); }
  #dcsec summary { cursor:pointer; list-style:none; padding:2px 0;
    text-transform:uppercase; letter-spacing:.5px; font-size:10px; color:var(--mut); }
  #dcsec summary::-webkit-details-marker { display:none; }
  #dcsec summary::before { content:'▸ '; }
  #dcsec[open] summary::before { content:'▾ '; }
  #dcstate { color:var(--warn); text-transform:none; letter-spacing:0; }
  #clipflags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
  #clipflags button { padding:3px 7px; font-size:11px; }
  #clipflags button.on { background:var(--warn); border-color:var(--warn); color:#2a1a00; font-weight:600; }
  #datanote { width:100%; background:#0e1218; border:1px solid var(--line); color:var(--fg);
    border-radius:5px; padding:5px 7px; font-size:11px; }
  #main { position:relative; min-width:0; min-height:0; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; background:#0b0e12; }
  #hud { position:absolute; top:10px; left:12px; background:#0d1117cc; padding:6px 10px;
    border-radius:6px; color:var(--mut); font-size:11px; pointer-events:none; }
  #toast { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:#0d1117ee; border:1px solid var(--line); padding:8px 14px; border-radius:8px;
    opacity:0; transition:opacity .2s; }
  #toast.show { opacity:1; }
  .row { display:flex; gap:6px; }
  .row button { flex:1; }
  kbd { background:#0e1218; border:1px solid var(--line); border-radius:3px; padding:0 4px; }
  #refpanel { position:absolute; left:12px; bottom:12px; width:min(430px,calc(100% - 24px)); background:#0d1117f2;
    border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:0 6px 24px #0008; }
  /* Minimised, not closed. The old × removed the panel with no way back except an
     undocumented keypress, so the reference was effectively destroyable. The
     header always remains and is itself the restore control. */
  #refpanel.min #refcv, #refpanel.min #reflabel { display:none; }
  #refpanel.min { width:auto; }
  #refpanel.min #refhead { cursor:pointer; }
  #refpanel.hidden { display:none; }
  #refhead { display:flex; justify-content:space-between; align-items:center; padding:6px 10px;
    background:#161b22; border-bottom:1px solid var(--line); font-size:11px; color:var(--mut); }
  #refhead button { padding:2px 7px; font-size:11px; }
  #refcv { display:block; width:100%; height:190px; background:#0b0e12; cursor:default; }
  #reflabel { padding:5px 10px; font-size:11px; color:var(--fg); border-top:1px solid var(--line);
    min-height:16px; }
  #reflabel b { color:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>caliPr <small>labeler</small></h1>
    <div class="sec">
      <div class="pickers">
        <label>dataset<select id="dsPick"></select></label>
        <label>view<select id="viewPick">
          <option value="lateral">lateral</option>
          <option value="frontal">frontal</option>
        </select></label>
      </div>
      <div id="cal">
        <span>known span</span>
        <input id="knownmm" type="number" step="0.1" value="10" />
        <span>mm</span>
      </div>
      <div id="calread">—</div>
      <div id="autocal"><button id="useauto">use ruler auto-scale</button><span id="autotxt"></span></div>
      <details id="imgpanel">
        <summary>image adjustments <span id="imgstate"></span></summary>
        <div id="imgctrl">
          <label>contrast <b id="vCtrst">1.00</b>
            <input id="ctrst" type="range" min="1" max="3.5" step="0.05" value="1"></label>
          <label>brightness <b id="vBrt">1.00</b>
            <input id="brt" type="range" min="0.4" max="2" step="0.05" value="1"></label>
          <label>saturation <b id="vSat">1.00</b>
            <input id="sat" type="range" min="0" max="2.5" step="0.05" value="1"></label>
          <label>gamma <b id="vGam">1.00</b>
            <input id="gam" type="range" min="0.4" max="2.2" step="0.05" value="1"></label>
          <div class="imgbtns">
            <button id="tGray" title="Drop colour — sometimes an edge is clearer without it">grayscale</button>
            <button id="tInv" title="Invert — can lift a faint margin out of a dark ground">invert</button>
            <button id="enhReset">reset</button>
          </div>
        </div>
      </details>
    </div>
    <div class="sec" id="rtsec">
      <button id="rtoggle" style="width:100%">✥ Fin retrace mode</button>
      <div id="rtstat"></div>
    </div>
    <details id="exportbox"><summary>export <span id="expstate"></span></summary>
      <div class="exprow"><button data-exp="measurements">Measurements (.xlsx)</button>
        <span>traits per specimen, ratios, QC</span></div>
      <div class="exprow"><button data-exp="tps">Landmarks for R (.tps)</button>
        <span>geomorph-ready, with landmark names</span></div>
      <div class="exprow"><button data-exp="overlays">Labelled images (.zip)</button>
        <span>each photo with its annotation drawn on</span></div>
    </details>
    <details id="legendbox" open><summary>badge key</summary><div id="legend"></div></details>
    <div id="specWrap"></div>
    <details id="dcsec"><summary>data note / compromise <span id="dcstate"></span></summary>
      <div id="clipflags"></div>
      <input id="datanote" type="text" placeholder="note any photo compromise…" />
    </details>
    <div class="sec">
      <div class="row" style="margin-bottom:6px">
        <button id="undo" title="Undo the SELECTED landmark's point (Z or ⌘/Ctrl+Z)">↶ Undo</button>
        <button id="finish" title="Close current polygon (Enter)">Finish poly</button>
        <button id="clear">Clear pt</button>
      </div>
      <div class="row" style="margin-bottom:6px">
        <button id="autolabel" title="Run the trained model on this specimen and
drop its landmarks in. Points it is unsure about come in orange — those are the
ones to check.">Auto-label</button>
        <button id="fit">Fit</button>
      </div>
      <div class="row">
        <button id="save" class="primary">Save sidecar</button>
      </div>
      <div id="autostat"></div>
    </div>
  </div>
  <div id="grip" title="Drag to resize"></div>
  <div id="taskcol">
    <div class="colhdr">Landmarks <span id="taskcount"></span>
      <label id="hideex" title="Hide the landmarks this study does not collect">
        <input type="checkbox" id="hideExcl"> hide excluded</label></div>
    <div id="hint">Select a specimen to begin.</div>
    <div id="tasks"></div>
  </div>
  <div id="grip2" title="Drag to resize"></div>
  <div id="main">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="refpanel">
      <div id="refhead"><span id="reftitle">Reference — example fish</span>
        <span><button id="refmode" title="Toggle overview / zoom">zoom</button>
        <button id="refmin" title="Minimise / restore (R)">–</button></span></div>
      <canvas id="refcv"></canvas>
      <div id="reflabel"></div>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const api = async (u,o) => (await fetch(u,o)).json();
let SCHEMA=null, SPECS=[], cur=null, view='lateral', activeTask=null, hoverName=null, imgFilter='none';
// Per-landmark model confidence for the points currently on screen, and the
// name of the model that produced them. A landmark leaves `pred` the moment a
// human moves it — that is what makes the colouring mean "not yet reviewed"
// rather than "was once predicted".
let pred={conf:{}, model:null, low:new Set()};
function clearPred(){ pred={conf:{}, model:null, low:new Set()}; const e=$('#autostat'); if(e) e.textContent=''; }
function unreviewed(){ return Object.keys(pred.conf).length; }
let retrace=false;                  // fin-retrace mode: one fin at a time, zoomed
let DATASETS=[], dataset='';        // which study's photographs are open
const dsq = () => '?dataset=' + encodeURIComponent(dataset);
const dsInfo = () => DATASETS.find(d=>d.name===dataset) || {};
let showAll=false;                  // hold H to reveal the hidden landmarks
// Above this many image pixels per screen pixel a click cannot be placed
// carefully. Matches the standalone labeler.
const COARSE_PX = 3;
const finGroups = () => (SCHEMA && SCHEMA.fin_groups) || [];
// A fin counts as re-done only when its outline is dense enough AND its base and
// tip are placed — the three describe one structure and the traits mix them, so
// a dense outline with a stale tip is not finished work.
function finState(g){
  const m=model?model.lateral:null; if(!m) return {n:0,kp:0,done:false};
  const n=(m.polygons[g.polygon]||[]).length;
  const kp=g.keypoints.filter(k=>m.keypoints[k.name]).length;
  return {n, kp, done: n>=g.target && kp===g.keypoints.length};
}
const finsLeft = () => finGroups().filter(g=>!finState(g).done);
let img=new Image(), imgW=0, imgH=0;
// Switching dataset while a 4000px JPEG is still decoding used to let the old
// image finish and repaint, and to fire a request the new dataset 404s on.
// Every load carries a token; a load whose token is stale is dropped.
let imgToken=0;
let vs={scale:1, ox:0, oy:0};       // view transform (image px -> screen)
// model[view] = {keypoints:{name:[x,y]}, polygons:{name:[[x,y]..]}, ruler:{a:[x,y],b:[x,y]}, known_mm}
let model=null;
const cv=$('#cv'), ctx=cv.getContext('2d');

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600);}

function blankModel(){return {lateral:emptyView(),frontal:emptyView(),data_note:'',exclude:[]};}
function emptyView(){return {keypoints:{},polygons:{},ruler:{},known_mm:null,auto_ppm:null,auto_notes:null};}

// One-click compromise flags. Each disables the traits that genuinely can't be
// trusted when that part of the specimen is missing from the photo.
const CLIP_FLAGS=[
  {id:'caudal_clipped', label:'caudal clipped', traits:['TL','CFd','CFs'],
   note:'caudal fin clipped by frame — TL/CFd/CFs unreliable'},
  {id:'snout_clipped',  label:'snout clipped',  traits:['TL','SL','Hl','Snl','AO','Mo','EMd','EMa'],
   note:'snout clipped by frame — anterior-anchored traits unreliable'},
  {id:'fin_damaged',    label:'fin damaged',    traits:[],
   note:'fin damaged/folded on specimen'},
];
function updateDcState(){
  const el=$('#dcstate'); if(!el||!model) return;
  const n=(model.flags||[]).length, note=(model.data_note||'').trim();
  el.textContent = (n||note) ? ` — ${n?n+' flag'+(n>1?'s':''):''}${n&&note?', ':''}${note?'note':''}` : '';
}
function renderClipFlags(){
  const box=$('#clipflags'); box.innerHTML='';
  CLIP_FLAGS.forEach(fl=>{
    const on=model && (model.flags||[]).includes(fl.id);
    const b=document.createElement('button');
    b.textContent=fl.label; if(on) b.classList.add('on');
    b.title='excludes: '+(fl.traits.join(', ')||'(no traits, note only)');
    b.onclick=()=>{ model.flags=model.flags||[];
      const i=model.flags.indexOf(fl.id);
      if(i>=0) model.flags.splice(i,1); else model.flags.push(fl.id);
      syncCompromise(); renderClipFlags(); updateDcState(); persistDraft(); };
    box.appendChild(b);
  });
}
function syncCompromise(){
  const flags=model.flags||[];
  const set=new Set(); const notes=[];
  CLIP_FLAGS.forEach(fl=>{ if(flags.includes(fl.id)){ fl.traits.forEach(t=>set.add(t)); notes.push(fl.note); } });
  model.exclude=[...set];
  const typed=$('#datanote').value.trim();
  model.data_note=[...notes, typed].filter(Boolean).join('; ');
}

// ---- draft persistence (survives page reload before an explicit Save) ----
// Renamed from the old 'jcalipr_*' prefix. Migrate on load rather than just
// switching the prefix — otherwise any in-progress draft would be orphaned in
// localStorage under a key nothing reads any more, which looks like data loss.
(function migrateDraftKeys(){
  try{
    for(const k of Object.keys(localStorage)){
      if(!k.startsWith('jcalipr_')) continue;
      const nk='calipr_'+k.slice('jcalipr_'.length);
      if(localStorage.getItem(nk)===null) localStorage.setItem(nk, localStorage.getItem(k));
      localStorage.removeItem(k);
    }
  }catch(e){}
})();
const draftKey=id=>'calipr_draft_'+id;
function persistDraft(){ if(!cur||!model)return; try{
  model._draft_at = Date.now();
  localStorage.setItem(draftKey(cur.id), JSON.stringify(model));
  localStorage.setItem('calipr_last', cur.id);
}catch(e){} }
// A draft older than the sidecar on disk is stale: the file changed outside this
// browser (bulk edit, hand fix, git checkout) and the draft would silently
// resurrect the old values. Drop it and say so rather than showing stale work.
function loadDraft(id){
  try{
    const s=localStorage.getItem(draftKey(id)); if(!s) return null;
    const d=JSON.parse(s);
    const spec=SPECS.find(x=>x.id===id);
    const fileMs=spec&&spec.mtime?spec.mtime*1000:0;
    if(fileMs && (!d._draft_at || d._draft_at < fileMs)){
      clearDraft(id);
      toast('Sidecar changed on disk — discarded an older local draft');
      return null;
    }
    return d;
  }catch(e){ return null; }
}
function clearDraft(id){ try{ localStorage.removeItem(draftKey(id)); }catch(e){} }

async function boot(){
  const info=await api('/api/datasets');
  DATASETS=info.datasets;
  const saved=localStorage.getItem('calipr_dataset');
  dataset = DATASETS.some(d=>d.name===saved) ? saved : info.default;
  $('#dsPick').innerHTML=DATASETS.map(d=>
    `<option value="${d.name}"${d.name===dataset?' selected':''}>${d.name} (${d.images})</option>`).join('');
  SCHEMA=await api('/api/schema'+dsq());
  restoreRetrace();
  await loadSpecs();
  loadRef(); loadCalStats();
  resize();
  const last=localStorage.getItem('calipr_last');   // re-open where you left off
  if(last){ const s=SPECS.find(x=>x.id===last); if(s){ await selectSpec(s);
    if(loadDraft(last)) toast('Restored unsaved draft'); } }
  if(retrace && model) nextFin();
  requestAnimationFrame(draw);
}
async function loadSpecs(){
  SPECS=await api('/api/specimens'+dsq());
  renderLegend();          // counts live on the key's rows now
  const w=$('#specWrap'); w.innerHTML='';
  // In retrace mode the list IS the worklist: only fish that are landmarked but
  // whose fins are not yet re-done. The one in hand stays visible so it does not
  // vanish from under the cursor the moment its last fin hits target.
  let shown = retrace
    ? SPECS.filter(s=>(s.lateral_done&&!s.fins_done)||(cur&&s.id===cur.id))
    : SPECS;
  // Held-out fish first: they are stratified across strains and they are what
  // measures model accuracy, so re-tracing them pays twice.
  if(retrace) shown = [...shown].sort((a,b)=>(b.heldout?1:0)-(a.heldout?1:0));
  // Unlabelled specimens from the stratified subset float to the top: labelling
  // the first n filenames concentrates the sample in a few collection lots, and
  // lot is confounded with locality and date.
  else shown = [...shown].sort((a,b)=>
    ((b.suggested&&!b.lateral_done)?1:0) - ((a.suggested&&!a.lateral_done)?1:0));
  shown.forEach(s=>{
    const d=document.createElement('div');
    d.className='spec'+(s.lateral_done?' done':'')+(cur&&cur.id===s.id?' active':'');
    // three independent marks: L = lateral labeled, F = mouth width collected,
    // V = every traced fin is dense enough for its area to be trusted. V is
    // separate from L because a fully landmarked fish can still have fins
    // traced too sparsely — amber means "labeled, but the fins need points".
    const L=`<span class="mk ${s.lateral_done?'on':''}" title="lateral">L</span>`;
    const F=`<span class="mk f ${s.frontal_done?'on':''}" title="frontal / mouth width">F</span>`;
    // V is about fin-outline density; a dataset that traces no fin outlines can
    // never satisfy it, so showing a permanently grey badge is just noise.
    const V=dsInfo().has_fin_polygons
      ? `<span class="mk v ${s.fins_done?'on':(s.lateral_done?'thin':'')}" `+
        `title="fin outlines dense enough for area">V</span>` : '';
    const H=s.heldout?`<span class="mk h on" title="DLC held-out — re-trace these first">H</span>`:'';
    const S=(s.suggested&&!s.lateral_done)
      ?`<span class="mk s on" title="stratified subset: one per collection lot, label these first">S</span>`:'';
    d.innerHTML=`<span>${s.id.replace('Salvelinus_fontinalis_','')}</span>`+
                `<span class="st">${S}${H}${L}${F}${V}</span>`;
    d.onclick=()=>selectSpec(s);
    w.appendChild(d);
  });
}
async function selectSpec(s){
  cur=s; model=blankModel(); clearPred();
  const draft=loadDraft(s.id);
  if(draft){ model=draft; }                 // unsaved in-progress work wins
  else if(s.labeled){ try{ const sc=await api('/api/sidecar/'+encodeURIComponent(s.id)+dsq());
    ingest(sc);}catch(e){} }               // else fall back to the committed sidecar
  localStorage.setItem('calipr_last', s.id);
  // Show only the human-typed remainder; the flag notes are regenerated by
  // syncCompromise() and must not be echoed back into the free-text field.
  $('#datanote').value = (model.data_note||'')
      .split(';').map(s=>s.trim())
      .filter(s=>s && !CLIP_FLAGS.some(fl=>fl.note===s))
      .join('; ');
  renderClipFlags(); updateDcState();
  await setView('lateral');
  loadAutoCal();
  await loadCalStats();      // the comparison median is per lot, so it moves with the specimen
  updateCalRead();
  warnIfNoScale();
  loadSpecs();
}
function restoreRetrace(){
  if(localStorage.getItem('calipr_retrace')){
    retrace=true; document.body.classList.add('retrace');
  }
}
function ingest(sc){
  for(const v of ['lateral','frontal']){
    const b=sc[v]; if(!b) continue;
    model[v].keypoints=Object.assign({},b.keypoints||{});
    model[v].polygons=Object.assign({},b.polygons||{});
    if(b.calibration){
      if(b.calibration.mode==='ticks'){ model[v].auto_ppm=b.calibration.px_per_mm;
        model[v].auto_notes=b.calibration.notes; }
      else { model[v].ruler={a:b.calibration.point_a,b:b.calibration.point_b};
        model[v].known_mm=b.calibration.known_mm; } }
  }
  // Restore the data-compromise record, else re-opening a saved specimen and
  // saving again would silently drop its note and trait exclusions.
  const meta=sc.metadata||{};
  model.data_note=meta.data_note||'';
  model.exclude=meta.exclude_traits||[];
  // Re-derive which flag buttons were on from the excluded traits.
  model.flags=CLIP_FLAGS.filter(fl=>fl.traits.length &&
      fl.traits.every(t=>model.exclude.includes(t))).map(fl=>fl.id);
  if(model.data_note){ CLIP_FLAGS.forEach(fl=>{                 // note-only flags
    if(!fl.traits.length && model.data_note.includes(fl.note) && !model.flags.includes(fl.id))
      model.flags.push(fl.id); }); }
}
function loadImage(){
  return new Promise(res=>{
    if(!cur){ imgW=imgH=0; buildTasks(); draw(); return res(); }
    const file = view==='lateral'?cur.lateral:cur.frontal;
    if(!file){ img=new Image(); imgW=imgH=0; buildTasks(); draw(); return res(); }
    const token=++imgToken;
    img=new Image();
    img.onerror=()=>{ if(token===imgToken){ imgW=imgH=0; draw(); } res(); };
    img.onload=()=>{ if(token!==imgToken) return res();   // superseded
      imgW=img.naturalWidth;imgH=img.naturalHeight;resize();fit();buildTasks();draw();res();};
    img.src='/img/'+view+'/'+encodeURIComponent(file)+dsq();
  });
}
// Per-view default span. The frontal mirror ruler is small — its usable span
// is 10 mm — while the lateral ruler is normally clicked over 50 mm. Without a
// per-view default, switching tabs silently inherited the other view's value,
// which is a 5x calibration error that nothing downstream can detect.
const DEFAULT_MM={lateral:50, frontal:10};
function setView(v){ view=v; $('#viewPick').value=v;
  if(!cur){ activeTask=null; buildTasks(); showHint(); draw(); return Promise.resolve(); }
  $('#knownmm').value = (model && model[view].known_mm) || DEFAULT_MM[v];
  if(model) model[view].known_mm = parseFloat($('#knownmm').value);
  activeTask=null; return loadImage(); }

function buildTasks(){
  const box=$('#tasks'); box.innerHTML='';
  const sc=SCHEMA[view]; if(!sc){return;}
  // Between datasets there is no specimen in hand. An empty model keeps the task
  // list rendering (unset) instead of throwing on model[view].
  const m=(model&&model[view])||{keypoints:{},polygons:{},ruler:{}};

  const hideEx = $('#hideExcl') && $('#hideExcl').checked;
  const mkTask=(kind,it,extra)=>{
    if(hideEx && it.excluded) return;
    const n = kind==='polygon' ? ((m.polygons[it.name]||[]).length) : 0;
    const target = (kind==='polygon' && it.target) ? it.target : 0;
    const set = kind==='polygon' ? (n >= Math.max(3, target))
              : kind==='ruler'   ? !!(m.ruler[it.name==='ruler_point_a'?'a':'b'])
              : !!m.keypoints[it.name];
    const el=document.createElement('div');
    el.className='task'+(set?' set':'')+(target&&n&&n<target?' thin':'')
      +(activeTask&&activeTask.name===it.name&&activeTask.kind===kind?' active':'');
    const count = target ? `<span class="cnt">${n}/${target}</span>` : '';
    if(it.excluded) el.classList.add('excluded');
    el.innerHTML=`<span class="dot"></span><span class="nm">${extra||it.name}</span>`+
                 `${count}<span class="kind">${kind[0]}</span>`+
                 (kind==='ruler'?'':`<span class="ex" title="${it.excluded
                   ?'Put this landmark back in scope'
                   :'Not available or not relevant — leave it out of this study'}">${
                   it.excluded?'+':'×'}</span>`);
    const x=el.querySelector('.ex');
    if(x) x.onclick=ev=>{ ev.stopPropagation(); toggleExcluded(kind,it.name); };
    el.onclick=()=>{activeTask={kind,name:it.name,hint:it.hint,desc:it.description,
                               target:it.target||0};
      if(retrace) zoomToFin(finOf(it.name));
      showHint(); buildTasks();};
    box.appendChild(el);
  };

  // Retrace mode: walk fin by fin — base, tip, then the outline. Keeps the three
  // annotations that describe one structure next to each other.
  if(retrace && view==='lateral'){
    const polyByName={}; (sc.polygons||[]).forEach(p=>polyByName[p.name]=p);
    finGroups().forEach(g=>{
      const st=finState(g);
      const h=document.createElement('div');
      h.className='grouphdr';
      h.innerHTML=`${g.fin} <span style="color:${st.done?'var(--good)':'var(--warn)'}">`+
                  `${st.done?'done':st.n+'/'+g.target+' pts, '+st.kp+'/2 kp'}</span>`;
      box.appendChild(h);
      g.keypoints.forEach(k=>mkTask('keypoint',k,`${k.name} (${k.role})`));
      if(polyByName[g.polygon]) mkTask('polygon',polyByName[g.polygon],`${g.fin} outline`);
    });
    renderRetraceStatus();
    return;
  }

  // Region grouping, always expanded. Headers are separators for scanning, not
  // controls: landmarking is a click-through task and the flow auto-advances, so
  // anything that has to be opened before it can be used is pure friction.
  const REGIONS=[
    ['ruler',    n=>/^ruler_/.test(n)],
    ['head',     n=>/^(eye_|premaxilla|maxilla|lower_jaw|operculum|snout)/.test(n)],
    ['pectoral', n=>/^pectoral/.test(n)],
    ['peduncle', n=>/^(peduncle|caudal)/.test(n)],
    ['dorsal',   n=>/^dorsal/.test(n)],
    ['pelvic',   n=>/^pelvic/.test(n)],
    ['anal',     n=>/^anal/.test(n)],
    ['body',     ()=>true],
  ];
  const all=[...(sc.ruler||[]).map(i=>['ruler',i]),
             ...(sc.keypoints||[]).map(i=>['keypoint',i]),
             ...(sc.polygons||[]).map(i=>['polygon',i])];
  const isSet=([kind,it])=>kind==='polygon'
      ? ((m.polygons[it.name]||[]).length >= Math.max(3, it.target||0))
      : kind==='ruler' ? !!(m.ruler[it.name==='ruler_point_a'?'a':'b'])
      : !!m.keypoints[it.name];
  const used=new Set();
  for(const [label,test] of REGIONS){
    const mine=all.filter(([k,it])=>!used.has(it.name) && test(it.name));
    if(!mine.length) continue;
    mine.forEach(([,it])=>used.add(it.name));
    const done=mine.filter(isSet).length;
    const h=document.createElement('div');
    h.className='grouphdr'+(done===mine.length?' done':'');
    h.innerHTML=`<span class="gn">${label}</span><span class="gc">${done}/${mine.length}</span>`;
    box.appendChild(h);
    mine.forEach(([kind,it])=>mkTask(kind,it));
  }

  const tc=$('#taskcount');
  if(tc){ const all=[...box.querySelectorAll('.task')];
    tc.textContent = all.length ? `${all.filter(e=>e.classList.contains('set')).length}/${all.length}` : ''; }
  renderRetraceStatus();
}
// Which fin a task belongs to (null if it is not a fin annotation).
function finOf(name){
  const g=finGroups().find(g=>g.polygon===name||g.keypoints.some(k=>k.name===name));
  return g||null;
}
// Frame the fin being worked on: zoom to its outline, or to its base/tip pair if
// no outline exists yet. Dense clicking is impossible at whole-fish zoom.
function zoomToFin(g){
  if(!g||!imgW) return;
  // Same guard as fit(): a hidden or not-yet-laid-out canvas measures 0x0, and
  // dividing by that clamps the scale to the floor and wrecks the framing.
  const rc=cv.getBoundingClientRect();
  if(!rc.width||!rc.height){ requestAnimationFrame(()=>zoomToFin(g)); return; }
  const m=model.lateral;
  let pts=(m.polygons[g.polygon]||[]).slice();
  g.keypoints.forEach(k=>{ if(m.keypoints[k.name]) pts.push(m.keypoints[k.name]); });
  // A fin whose outline AND tip were both wiped leaves only the base point, and
  // one point has no extent to frame. Rather than give up — which drops the user
  // at whole-fish zoom on precisely the fins that need dense clicking — put a box
  // around what is left, sized from the fish itself so it scales with the photo.
  if(pts.length===1){
    const a=m.keypoints['premaxilla_tip'], b=m.keypoints['caudal_base'];
    const sl=(a&&b)?Math.hypot(b[0]-a[0],b[1]-a[1]):Math.max(imgW,imgH)*0.35;
    // a brook trout fin runs ~0.10-0.15 SL, so 0.09 SL either side frames it
    // at roughly 1.5x its own size — comparable to what an intact outline gives
    const r=0.09*sl, [x,y]=pts[0];
    pts=[[x-r,y-r],[x+r,y+r]];
  }
  if(pts.length<2) return;                       // nothing placed at all
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const w=Math.max(...xs)-Math.min(...xs), h=Math.max(...ys)-Math.min(...ys);
  const pad=Math.max(0.35*Math.max(w,h), 60);
  const r=cv.getBoundingClientRect();
  const s=Math.min(r.width/(w+2*pad), r.height/(h+2*pad));
  vs.scale=Math.max(0.02,Math.min(30,s));
  vs.ox=r.width/2-((Math.min(...xs)+Math.max(...xs))/2)*vs.scale;
  vs.oy=r.height/2-((Math.min(...ys)+Math.max(...ys))/2)*vs.scale;
  draw();
}
function renderLegend(){
  const n=SPECS.length;
  const dl=SPECS.filter(s=>s.lateral_done).length;
  const df=SPECS.filter(s=>s.frontal_done).length;
  const dv=SPECS.filter(s=>s.fins_done).length;
  const sTot=SPECS.filter(s=>s.suggested).length;
  const sDone=SPECS.filter(s=>s.suggested&&s.lateral_done).length;
  const hTot=SPECS.filter(s=>s.heldout).length;
  const hDone=SPECS.filter(s=>s.heldout&&s.lateral_done).length;
  const rows=[
    ['mk on','L','lateral view labelled', dl, n],
    ['mk f on','F','frontal labelled (mouth width)', df, n],
    dsInfo().has_fin_polygons
      ? ['mk v on','V','fin outlines dense enough', dv, dl] : null,
    sTot ? ['mk s on','S','stratified subset — do these first', sDone, sTot] : null,
    hTot ? ['mk h on','H','held out from model training', hDone, hTot] : null,
  ].filter(Boolean);
  $('#legend').innerHTML = rows.map(([c,l,t,a,b])=>
    `<div class="lr"><span class="${c}">${l}</span><span>${t}</span>`+
    `<span class="n">${a}/${b}</span></div>`).join('');
}
function renderRetraceStatus(){
  const el=$('#rtstat'); if(!el) return;
  if(!retrace){ el.innerHTML=''; return; }
  const wl=SPECS.filter(s=>s.lateral_done&&!s.fins_done).length;
  if(!model){ el.innerHTML=`<b>${wl}</b> specimens need fin work.`; return; }
  const bits=finGroups().map(g=>{const st=finState(g);
    return `<span class="fin ${st.done?'ok':'thin'}">${g.fin} ${st.n}/${g.target}`+
           `${st.kp<g.keypoints.length?' ·kp':''}</span>`;}).join('');
  el.innerHTML=`${bits}<br><b>${wl}</b> specimens left · <kbd>F</kbd> next fin `+
               `· <kbd>N</kbd> next specimen · hold <kbd>H</kbd> to show all`;
}
// Excluding a landmark is a study-level decision, so it is written to the
// dataset's schema and reaches the measurement engine — a trait that needed it
// gets no Excel column at all, rather than a column of blanks that reads as
// "measured and missing".
async function toggleExcluded(kind, name){
  const kps=SCHEMA.lateral.keypoints.filter(k=>k.excluded).map(k=>k.name);
  const pol=SCHEMA.lateral.polygons.filter(p=>p.excluded).map(p=>p.name);
  const list = kind==='polygon' ? pol : kps;
  const i=list.indexOf(name);
  if(i>=0) list.splice(i,1); else list.push(name);
  try{
    const r=await api('/api/schema/exclude'+dsq(),{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({exclude_keypoints:kps, exclude_polygons:pol})});
    SCHEMA=await api('/api/schema'+dsq());
    if(activeTask && ((kind==='polygon'?pol:kps).includes(activeTask.name))) activeTask=null;
    buildTasks(); showHint(); draw();
    const d=(r.dropped_traits||[]).length;
    toast((i>=0?'Restored ':'Excluded ')+name+(d?` — ${d} trait column(s) omitted from export`:''));
  }catch(e){ toast('Could not save that: '+e.message); }
}
function showHint(){
  if(!activeTask){$('#hint').innerHTML='Pick a landmark from the list, then click on the image. '+
    '<kbd>wheel</kbd> zoom · <kbd>drag</kbd> pan';return;}
  const t=activeTask;
  const n=(model[view].polygons[t.name]||[]).length;
  const dens = (t.kind==='polygon' && t.target)
    ? ` &nbsp;<b style="color:${n>=t.target?'var(--good)':'var(--warn)'}">${n}/${t.target} vertices</b>` +
      (n<t.target ? ' — sparse outlines read the fin small' : '')
    : '';
  $('#hint').innerHTML=`<b>${t.name}</b> — ${t.hint||t.desc||''}` +
    (t.kind==='polygon'?' &nbsp;(trace vertices; <kbd>Enter</kbd>=finish. On a finished outline: click the line to insert a vertex, drag any vertex to move.)':'')
    + dens;
  drawRef();
}

// ---- view transform ----
function fit(){ if(!imgW){return;} const r=cv.getBoundingClientRect();
  if(!r.width||!r.height){ requestAnimationFrame(fit); return; }  // canvas not laid out yet
  const s=Math.min(r.width/imgW, r.height/imgH)*0.96;
  vs.scale=s; vs.ox=(r.width-imgW*s)/2; vs.oy=(r.height-imgH*s)/2; }
function toImg(sx,sy){return [(sx-vs.ox)/vs.scale,(sy-vs.oy)/vs.scale];}
function toScr(ix,iy){return [ix*vs.scale+vs.ox, iy*vs.scale+vs.oy];}

function draw(){
  const r=cv.getBoundingClientRect();
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  if(imgW){ ctx.imageSmoothingEnabled=false; ctx.filter=imgFilter;
    ctx.drawImage(img, vs.ox, vs.oy, imgW*vs.scale, imgH*vs.scale); ctx.filter='none'; }
  const m=model?model[view]:null; if(m){
    // In retrace mode only the fin being worked on is drawn. body_plus_caudal is
    // 52-86 vertices running the length of the fish and it buries the specimen;
    // the other fins and the ruler are just as unhelpful when the view is zoomed
    // into one fin. Hold H to bring everything back when context is wanted.
    const only = (retrace && view==='lateral' && !showAll && activeTask)
      ? finOf(activeTask.name) : null;
    const visiblePoly = nm => !only || nm===only.polygon;
    const visibleKp   = nm => !only || only.keypoints.some(k=>k.name===nm);

    // polygons
    for(const [nm,verts] of Object.entries(m.polygons)){
      if(!verts||!verts.length||!visiblePoly(nm)) continue;
      ctx.beginPath();
      verts.forEach((p,i)=>{const [x,y]=toScr(p[0],p[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      const active=activeTask&&activeTask.kind==='polygon'&&activeTask.name===nm;
      if(!active||verts.length>=3) ctx.closePath();
      ctx.strokeStyle=active?'#7fd0ff':'#4aa3ff88'; ctx.lineWidth=active?2.5:1.5; ctx.stroke();
      ctx.fillStyle=active?'#7fd0ff2e':'#4aa3ff1a'; if(verts.length>=3) ctx.fill();
      verts.forEach(p=>dot(p,active?'#7fd0ff':'#4aa3ff',active?3:2.5));
      if(active){ let cx=0,cy=0; verts.forEach(p=>{cx+=p[0];cy+=p[1];});
        label([cx/verts.length, cy/verts.length], nm); }   // name the selected polygon
    }
    // keypoints — only label the ACTIVE landmark or the one under the cursor,
    // so placed labels don't pile up and obscure the fish.
    const kpc=getComputedStyle(document.documentElement).getPropertyValue('--kp');
    for(const [nm,p] of Object.entries(m.keypoints)){
      if(!visibleKp(nm)) continue;
      // An unreviewed prediction is drawn by the model's own confidence: green
      // where it is sure, orange where it is not. Touching the point returns it
      // to the normal colour, so what stays coloured is what still needs a look.
      const c = (view==='lateral') ? pred.conf[nm] : undefined;
      const col = c===undefined ? kpc
                : (c>=0.6 ? 'var(--good)' : 'var(--warn)');
      dot(p, col==='var(--good)' ? '#37c871' : col==='var(--warn)' ? '#ffb454' : kpc,
          c===undefined ? 3.5 : 4.5);
      if(c!==undefined && c<0.6){            // ring the ones worth checking
        const [sx,sy]=toScr(p[0],p[1]);
        ctx.beginPath(); ctx.arc(sx,sy,8,0,7);
        ctx.strokeStyle='#ffb454'; ctx.lineWidth=1.5; ctx.stroke(); }
      if(nm===(activeTask&&activeTask.name) || nm===hoverName)
        label(p, c===undefined ? nm : `${nm} ${c.toFixed(2)}`); }
    // ruler
    if(!only && m.ruler.a&&m.ruler.b){ const a=toScr(...m.ruler.a),b=toScr(...m.ruler.b);
      ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
      ctx.strokeStyle='#c07bff';ctx.lineWidth=1.5;ctx.stroke(); }
    if(!only && m.ruler.a) dot(m.ruler.a,'#c07bff',3.5);
    if(!only && m.ruler.b) dot(m.ruler.b,'#c07bff',3.5);
  }
  // One screen pixel covers 1/scale image pixels, and that is the floor on
  // placement precision however steady the hand. Fitted to a 4400px crop it is
  // several image pixels, so a point placed without zooming is imprecise by
  // construction rather than by carelessness — and nothing said so.
  const perPx = vs.scale>0 ? 1/vs.scale : 0;
  const coarse = perPx > COARSE_PX;
  const hud=$('#hud');
  hud.textContent=`${cur?cur.id.replace('Salvelinus_fontinalis_',''):'—'} · ${view} · `+
    `${(vs.scale*100|0)}% · ±${perPx.toFixed(1)}px`+(coarse?' — zoom in to place accurately':'');
  hud.style.color = coarse ? 'var(--warn)' : '';
}
function dot(p,color,rr){const [x,y]=toScr(p[0],p[1]);ctx.beginPath();ctx.arc(x,y,rr,0,7);
  ctx.fillStyle=color;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#000a';ctx.stroke();}
function label(p,t){const [x,y]=toScr(p[0],p[1]);ctx.font='10px sans-serif';
  ctx.fillStyle='#000a';ctx.fillRect(x+5,y-6,ctx.measureText(t).width+4,11);
  ctx.fillStyle='#fff';ctx.fillText(t,x+7,y+3);}

let warnedCoarse=false;
function place(ix,iy){
  if(!activeTask){toast('Pick a landmark first');return;}
  if(!warnedCoarse && vs.scale>0 && 1/vs.scale > COARSE_PX){
    warnedCoarse=true;
    toast(`Zoomed out — each click lands within ~${(1/vs.scale).toFixed(0)} image px. `+
          `Scroll to zoom in for accurate placement.`);
  }
  const m=model[view], t=activeTask, pt=[Math.round(ix),Math.round(iy)];
  if(t.kind==='keypoint'){ m.keypoints[t.name]=pt; reviewed(t.name);
    warnOverlap(t.name,pt); advance(); }
  else if(t.kind==='ruler'){ const key=t.name==='ruler_point_a'?'a':'b'; m.ruler[key]=pt;
    if(t.name==='ruler_point_a'){activeTask=null;pickByName('ruler','ruler_point_b');} else advance(); }
  else if(t.kind==='polygon'){ const arr=m.polygons[t.name]||(m.polygons[t.name]=[]);
    const e = arr.length>=3 ? findEdgeAt(ix,iy,t.name) : null;
    if(e){ arr.splice(e.index,0,pt); toast('Inserted vertex — drag to adjust'); }  // click on outline
    else arr.push(pt); }                                                            // extend the trace
  persistDraft(); buildTasks(); showHint(); draw(); updateCalRead();
}
function warnOverlap(name,pt){
  const m=model[view];
  for(const [nm,p] of Object.entries(m.keypoints)){
    if(nm!==name && Math.abs(p[0]-pt[0])<4 && Math.abs(p[1]-pt[1])<4){
      toast(`⚠ on top of ${nm} — select it + press Z to undo`); return; }
  }
}
// Undo acts on the CURRENTLY SELECTED landmark: clears its point (or pops the
// last vertex for a polygon) and keeps it selected so you can re-place it.
function undo(){
  if(!activeTask){ toast('Select the landmark you want to undo'); return; }
  const m=model[view], t=activeTask;
  if(t.kind==='polygon'){ const arr=m.polygons[t.name];
    if(arr&&arr.length){ arr.pop(); if(!arr.length) delete m.polygons[t.name]; toast('Removed a vertex of '+t.name); }
    else toast(t.name+': no vertex to undo'); }
  else if(t.kind==='keypoint'){ if(m.keypoints[t.name]){ delete m.keypoints[t.name]; toast('Cleared '+t.name); }
    else toast(t.name+' isn’t placed'); }
  else if(t.kind==='ruler'){ const k=t.name==='ruler_point_a'?'a':'b';
    if(m.ruler[k]){ m.ruler[k]=undefined; toast('Cleared '+t.name); } else toast(t.name+' isn’t placed'); }
  hoverName=null; persistDraft(); buildTasks(); showHint(); draw();
}
function pickByName(kind,name){const it=(SCHEMA[view][kind==='ruler'?'ruler':kind+'s']||[]).find(x=>x.name===name);
  if(it){activeTask={kind,name,hint:it.hint,desc:it.description};showHint();buildTasks();}}
function taskOrder(){
  const sc=SCHEMA[view];
  return [...sc.ruler.map(x=>['ruler',x]), ...sc.keypoints.map(x=>['keypoint',x]),
          ...sc.polygons.map(x=>['polygon',x])];
}
// Move to the NEXT task in list order — not the next empty one. Landmarks are
// often skipped deliberately (obscured, damaged, not applicable), and jumping
// back to them would fight the labeler instead of following the list.
function advance(){
  if(retrace && view==='lateral'){ advanceFin(); return; }
  const order=taskOrder();
  const i=order.findIndex(([kind,it]) =>
      activeTask && kind===activeTask.kind && it.name===activeTask.name);
  const nxt=order[i+1];
  if(!nxt){ activeTask=null; showHint(); return; }
  const [kind,it]=nxt;
  activeTask={kind,name:it.name,hint:it.hint,desc:it.description};
  showHint();
}

// Retrace order: base -> tip -> outline, then on to the next unfinished fin.
// Stops rather than wrapping, so finishing the last fin is an explicit signal.
function advanceFin(){
  const seq=[];
  finGroups().forEach(g=>{
    g.keypoints.forEach(k=>seq.push({kind:'keypoint',name:k.name,hint:k.hint,
                                     desc:k.description,target:0,g}));
    const po=(SCHEMA.lateral.polygons||[]).find(p=>p.name===g.polygon);
    if(po) seq.push({kind:'polygon',name:po.name,hint:po.hint,desc:po.description,
                     target:po.target||0,g});
  });
  const i=seq.findIndex(t=>activeTask&&t.kind===activeTask.kind&&t.name===activeTask.name);
  const next=seq.slice(i+1).find(t=>{
    const st=finState(t.g);
    if(t.kind==='keypoint') return !model.lateral.keypoints[t.name];
    return st.n < t.target;
  });
  if(!next){
    const left=finsLeft();
    if(!left.length){ activeTask=null; showHint();
      toast('All four fins re-done — save, then N for the next specimen'); return; }
    // nothing unfinished after here, but earlier fins remain — jump back to one
    const g=left[0];
    const miss=g.keypoints.find(k=>!model.lateral.keypoints[k.name]);
    const po=(SCHEMA.lateral.polygons||[]).find(p=>p.name===g.polygon);
    activeTask=miss?{kind:'keypoint',name:miss.name,hint:miss.hint,desc:miss.description,target:0}
                   :{kind:'polygon',name:po.name,hint:po.hint,desc:po.description,target:po.target||0};
    zoomToFin(g); showHint(); return;
  }
  activeTask={kind:next.kind,name:next.name,hint:next.hint,desc:next.desc,target:next.target};
  zoomToFin(next.g); showHint();
}
function nextFin(){
  const curG=activeTask?finOf(activeTask.name):null;
  const gs=finGroups();
  const start=curG?gs.indexOf(curG)+1:0;
  const order=[...gs.slice(start),...gs.slice(0,start)];
  const g=order.find(g=>!finState(g).done)||order[0];
  if(!g) return;
  const miss=g.keypoints.find(k=>!model.lateral.keypoints[k.name]);
  const po=(SCHEMA.lateral.polygons||[]).find(p=>p.name===g.polygon);
  activeTask=miss?{kind:'keypoint',name:miss.name,hint:miss.hint,desc:miss.description,target:0}
                 :{kind:'polygon',name:po.name,hint:po.hint,desc:po.description,target:po.target||0};
  zoomToFin(g); showHint(); buildTasks();
}
function nextSpecimen(){
  const wl=SPECS.filter(s=>s.lateral_done&&!s.fins_done&&(!cur||s.id!==cur.id));
  if(!wl.length){ toast('No specimens left needing fin work'); return; }
  selectSpec(wl[0]).then(()=>{ if(retrace) nextFin(); });
}

// ---- mouse / keyboard ----
// Find an existing point near screen (mx,my). Keypoints/ruler take priority
// over polygon vertices so you can grab a landmark that sits on the outline.
function findPointAt(mx,my,thresh=12){
  const m=model?model[view]:null; if(!m) return null;
  const only=(retrace && view==='lateral' && !showAll && activeTask)?finOf(activeTask.name):null;
  const hidden=nm=>only && nm!==only.polygon && !only.keypoints.some(k=>k.name===nm);
  let best=null, bd=thresh;
  for(const [nm,p] of Object.entries(m.keypoints)){
    if(hidden(nm)) continue;
    const [sx,sy]=toScr(p[0],p[1]);
    const d=Math.hypot(sx-mx,sy-my); if(d<bd){bd=d;best={kind:'keypoint',name:nm};} }
  for(const k of ['a','b']){ const p=m.ruler[k]; if(!p||only)continue; const [sx,sy]=toScr(p[0],p[1]);
    const d=Math.hypot(sx-mx,sy-my); if(d<bd){bd=d;best={kind:'ruler',key:k};} }
  if(best) return best;
  bd=thresh;
  for(const [nm,verts] of Object.entries(m.polygons)){
    if(hidden(nm)) continue;                       // never grab an invisible vertex
    verts.forEach((p,i)=>{ const [sx,sy]=toScr(p[0],p[1]);
    const d=Math.hypot(sx-mx,sy-my); if(d<bd){bd=d;best={kind:'polyvtx',name:nm,index:i};} }); }
  return best;
}
function moveDrag(t,ix,iy){ const m=model[view], pt=[Math.round(ix),Math.round(iy)];
  if(t.kind==='keypoint') m.keypoints[t.name]=pt;
  else if(t.kind==='ruler') m.ruler[t.key]=pt;
  else if(t.kind==='polyvtx') m.polygons[t.name][t.index]=pt; }
function dragName(t){ return t.kind==='ruler'?('ruler_point_'+t.key)
  : t.kind==='polyvtx'?(t.name+' vertex') : t.name; }
// distance (image space) from point p to segment a-b
function distToSeg(p,a,b){ const vx=b[0]-a[0],vy=b[1]-a[1], wx=p[0]-a[0],wy=p[1]-a[1];
  const c1=vx*wx+vy*wy; if(c1<=0) return Math.hypot(wx,wy);
  const c2=vx*vx+vy*vy; if(c2<=c1) return Math.hypot(p[0]-b[0],p[1]-b[1]);
  const t=c1/c2; return Math.hypot(p[0]-(a[0]+t*vx), p[1]-(a[1]+t*vy)); }
// If (ix,iy) is within ~8 screen-px of an edge of the given (closed) polygon,
// return the index at which to splice a new vertex; else null.
function findEdgeAt(ix,iy,polyName){
  const verts=model[view].polygons[polyName]; if(!verts||verts.length<3) return null;
  const threshImg=8/Math.max(vs.scale,1e-6); let best=null, bd=threshImg;
  for(let i=0;i<verts.length;i++){ const d=distToSeg([ix,iy],verts[i],verts[(i+1)%verts.length]);
    if(d<bd){ bd=d; best={index:i+1}; } }
  return best;
}

let down=null, moved=0, dragTarget=null, dragStarted=false;
cv.addEventListener('mousedown',e=>{
  const r=cv.getBoundingClientRect();
  dragTarget=findPointAt(e.clientX-r.left, e.clientY-r.top);  // grab a point if we're on one
  dragStarted=false; down=[e.clientX,e.clientY]; moved=0;
});
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  if(down){ const dx=e.clientX-down[0],dy=e.clientY-down[1]; moved+=Math.abs(dx)+Math.abs(dy);
    if(dragTarget){ if(moved>3){ dragStarted=true; const [ix,iy]=toImg(mx,my); moveDrag(dragTarget,ix,iy); draw(); }
      down=[e.clientX,e.clientY]; return; }               // dragging a point (not panning)
    vs.ox+=dx; vs.oy+=dy; down=[e.clientX,e.clientY]; draw(); return; }  // panning
  const found=findPointAt(mx,my); cv.style.cursor=found?'move':'crosshair';
  const hn=found&&found.kind==='keypoint'?found.name:null;
  if(hn!==hoverName){ hoverName=hn; draw(); }
});
cv.addEventListener('mouseleave',()=>{ if(hoverName){hoverName=null;draw();} });
window.addEventListener('mouseup',e=>{
  if(dragTarget&&dragStarted){
    if(dragTarget.kind==='keypoint') reviewed(dragTarget.name);
    persistDraft(); buildTasks(); draw(); toast('Moved '+dragName(dragTarget)); }
  else if(down&&moved<5){ const r=cv.getBoundingClientRect();      // plain click → place
    const [ix,iy]=toImg(e.clientX-r.left,e.clientY-r.top);
    if(ix>=0&&iy>=0&&ix<=imgW&&iy<=imgH) place(ix,iy); }
  down=null; dragTarget=null; dragStarted=false;
});
const ZOOM_SENS=0.0010;  // lower = less sensitive wheel zoom
cv.addEventListener('wheel',e=>{e.preventDefault(); const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top; const [ix,iy]=toImg(mx,my);
  // proportional to scroll amount (smooth across mouse/trackpad), clamped per event
  let d=e.deltaY; if(e.deltaMode===1) d*=16; else if(e.deltaMode===2) d*=r.height; // lines/pages→px
  d=Math.max(-60,Math.min(60,d));                 // cap a single big flick
  const f=Math.exp(-d*ZOOM_SENS);
  const ns=Math.max(0.02, Math.min(30, vs.scale*f));
  vs.scale=ns; vs.ox=mx-ix*ns; vs.oy=my-iy*ns; draw();},{passive:false});
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Enter'){e.preventDefault(); if(activeTask&&activeTask.kind==='polygon'){advance();buildTasks();draw();}}
  if((e.key==='z'||e.key==='Z') && !e.shiftKey){ e.preventDefault(); undo(); }
  if(retrace && (e.key==='f'||e.key==='F')){ e.preventDefault(); nextFin(); }
  if(retrace && (e.key==='h'||e.key==='H') && !showAll){ showAll=true; draw(); }
  if(retrace && (e.key==='n'||e.key==='N')){ e.preventDefault(); nextSpecimen(); }
});
window.addEventListener('keyup',e=>{
  if(showAll && (e.key==='h'||e.key==='H')){ showAll=false; draw(); }
});
$('#undo').onclick=undo;
$('#finish').onclick=()=>{advance();buildTasks();draw();};
$('#clear').onclick=()=>{ if(!activeTask)return; const m=model[view];
  if(activeTask.kind==='keypoint')delete m.keypoints[activeTask.name];
  else if(activeTask.kind==='polygon')delete m.polygons[activeTask.name];
  else m.ruler[activeTask.name==='ruler_point_a'?'a':'b']=undefined; persistDraft();buildTasks();draw();};
$('#fit').onclick=()=>{fit();draw();};
$('#rtoggle').onclick=async()=>{
  retrace=!retrace;
  document.body.classList.toggle('retrace',retrace);
  localStorage.setItem('calipr_retrace',retrace?'1':'');
  if(retrace){
    await setView('lateral');
    if(model) nextFin(); else toast('Pick a specimen from the worklist');
  } else { activeTask=null; showHint(); fit(); draw(); }
  loadSpecs(); buildTasks();
};
$('#useauto').onclick=applyAutoCal;
// Ruler auto-scale: measures px/mm from the ruler's mm ticks, so calibration
// needs no clicked points and no typed span.
let autoCal=null;
async function loadAutoCal(){
  autoCal=null; $('#autotxt').textContent='detecting…';
  if(!cur||!cur.lateral){ $('#autotxt').textContent=''; return; }
  try{
    const r=await api('/api/autocal/'+encodeURIComponent(cur.lateral)+dsq());
    if(r && r.px_per_mm){ autoCal=r;
      $('#autotxt').textContent=`${r.px_per_mm.toFixed(2)} px/mm detected`; }
    else { $('#autotxt').textContent='auto-scale unavailable'; }
  }catch(e){ $('#autotxt').textContent='auto-scale unavailable'; }
}
function applyAutoCal(){
  if(!autoCal){ toast('No auto-scale for this image'); return; }
  model[view].auto_ppm=autoCal.px_per_mm;
  model[view].auto_notes=autoCal.notes;
  persistDraft(); updateCalRead(); buildTasks(); draw();
  toast(`Using ${autoCal.px_per_mm.toFixed(2)} px/mm from ruler ticks`);
}

// Live px/mm readout — catches a mistyped known_mm (the one calibration error
// nothing downstream can detect, since the wrong scale is self-consistent).
let calMedian=null;
const lotOf = id => { const m=/CUMV[A-Za-z]*_(\d+)/i.exec(id) || /_([A-Za-z]{2,4})_\d+$/.exec(id);
  return m ? m[1] : ''; };
async function loadCalStats(){ try{
  const lot = cur ? lotOf(cur.id) : '';
  const s=await api('/api/calibstats'+dsq()+(lot?'&lot='+encodeURIComponent(lot):''));
  calMedian=s.median_px_per_mm; }catch(e){} }
// Announce a missing scale when the specimen is opened, not when the workbook is
// exported weeks later. Named, so it is obvious which fish it refers to when
// several are being worked through.
function warnIfNoScale(){
  if(!model||!cur) return;
  const m=model.lateral;
  const has = m.auto_ppm || (m.ruler.a && m.ruler.b && (m.known_mm>0 ||
                             parseFloat($('#knownmm').value)>0));
  if(!has) toast('No scale on '+cur.id.replace('Salvelinus_fontinalis_','')+
                 ' — this specimen will measure in pixels');
}
function updateCalRead(){
  const el=$('#calread'); if(!el||!model) return;
  const m=model[view], km=parseFloat($('#knownmm').value);
  if(m.auto_ppm){ el.className='';
    el.textContent=`✓ auto-scale ${m.auto_ppm.toFixed(2)} px/mm (ruler ticks)`; return; }
  if(!(m.ruler.a&&m.ruler.b)||!(km>0)){
    // Unmistakable, because a specimen saved without a scale exports in PIXELS
    // and that is not visible from the numbers afterwards.
    el.className='warn';
    el.textContent='NO SCALE — measurements will be in pixels, not mm';
    return; }
  const px=Math.hypot(m.ruler.b[0]-m.ruler.a[0], m.ruler.b[1]-m.ruler.a[1]);
  const ppm=px/km;
  let msg=`${px.toFixed(0)} px ÷ ${km} mm = ${ppm.toFixed(2)} px/mm`;
  const off = calMedian && (ppm>calMedian*1.35 || ppm<calMedian*0.74);
  if(off){ el.className='warn';
    el.textContent=`⚠ ${ppm.toFixed(1)} px/mm — others ≈ ${calMedian.toFixed(1)}. Check "known span".`; }
  else { el.className=''; el.textContent=msg + (calMedian?`  (batch ≈ ${calMedian.toFixed(1)})`:''); }
}
// Display only. None of this touches a stored coordinate — it changes what the
// canvas paints, never what a click records.
let gray=false, inv=false;
function updateImgFilter(){
  const c=+$('#ctrst').value, b=+$('#brt').value,
        sa=+$('#sat').value, g=+$('#gam').value;
  $('#vCtrst').textContent=c.toFixed(2); $('#vBrt').textContent=b.toFixed(2);
  $('#vSat').textContent=sa.toFixed(2);  $('#vGam').textContent=g.toFixed(2);
  const parts=[];
  if(c!==1) parts.push(`contrast(${c})`);
  if(b!==1) parts.push(`brightness(${b})`);
  if(sa!==1) parts.push(`saturate(${sa})`);
  // Canvas has no gamma filter; brightness on a mid-grey pivot is the closest
  // thing that still lifts shadow detail without blowing the highlights.
  if(g!==1) parts.push(`brightness(${(1/g).toFixed(3)}) contrast(${g.toFixed(3)})`);
  if(gray) parts.push('grayscale(1)');
  if(inv) parts.push('invert(1)');
  imgFilter = parts.length ? parts.join(' ') : 'none';
  $('#tGray').classList.toggle('on',gray);
  $('#tInv').classList.toggle('on',inv);
  const n=parts.length;
  $('#imgstate').textContent = n ? ` — ${n} active` : '';
  draw();
}
['#ctrst','#brt','#sat','#gam'].forEach(id=>$(id).oninput=updateImgFilter);
$('#tGray').onclick=()=>{gray=!gray;updateImgFilter();};
$('#tInv').onclick=()=>{inv=!inv;updateImgFilter();};
$('#enhReset').onclick=()=>{
  $('#ctrst').value=1;$('#brt').value=1;$('#sat').value=1;$('#gam').value=1;
  gray=false;inv=false;updateImgFilter();};
$('#datanote').oninput=()=>{ if(model){ syncCompromise(); updateDcState(); persistDraft(); } };

// Browsers restore <details> state across a reload on their own, which looks

// Column widths: remembered, clamped, and applied before first paint so the
// canvas is measured against the real layout rather than resized after it.
const COLS = {
  '--sidew': {grip:'#grip',  key:'calipr_sidew', def:320, min:250, max:620},
  '--taskw': {grip:'#grip2', key:'calipr_taskw', def:240, min:170, max:460},
};
function setCol(varName, px){
  const c=COLS[varName];
  const w=Math.round(Math.max(c.min, Math.min(c.max, px)));
  document.documentElement.style.setProperty(varName, w+'px');
  localStorage.setItem(c.key, String(w));
  resize(); draw(); drawRef();
}
Object.entries(COLS).forEach(([v,c])=>{
  const saved=parseInt(localStorage.getItem(c.key)||'',10);
  document.documentElement.style.setProperty(v,
    Math.max(c.min, Math.min(c.max, saved||c.def))+'px');
});
Object.entries(COLS).forEach(([v,c])=>{
  const grip=$(c.grip); if(!grip) return;
  let dragging=false;
  grip.addEventListener('mousedown',e=>{ dragging=true; e.preventDefault();
    grip.classList.add('drag'); document.body.classList.add('resizing'); });
  window.addEventListener('mousemove',e=>{
    if(!dragging) return;
    // measured from the column's own left edge, so the second grip does not
    // jump when the first one has been moved
    const left=$(v==='--sidew'?'#side':'#taskcol').getBoundingClientRect().left;
    setCol(v, e.clientX-left);
  });
  window.addEventListener('mouseup',()=>{ if(!dragging) return; dragging=false;
    grip.classList.remove('drag'); document.body.classList.remove('resizing'); });
  grip.addEventListener('dblclick',()=>setCol(v, c.def));
});

// Exports are built on demand by the server and handed back as a download. They
// can take a while on a big dataset, so the button reports what is happening
// rather than appearing to do nothing.
document.querySelectorAll('#exportbox button[data-exp]').forEach(btn=>{
  btn.onclick=async()=>{
    const kind=btn.dataset.exp, label=btn.textContent;
    const all=[...document.querySelectorAll('#exportbox button[data-exp]')];
    all.forEach(b=>b.disabled=true);
    btn.textContent='working…'; $('#expstate').textContent=' — building '+kind;
    try{
      const res=await fetch('/api/export/'+kind+dsq());
      if(!res.ok){
        let msg='export failed';
        try{ msg=(await res.json()).error || msg; }catch(e){}
        alert('Export failed:\n\n'+msg);
        return;
      }
      const blob=await res.blob();
      const cd=res.headers.get('Content-Disposition')||'';
      const m=/filename="([^"]+)"/.exec(cd);
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=m?m[1]:(dataset+'_'+kind);
      a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      toast('Exported '+a.download+' ('+Math.round(blob.size/1024)+' KB)');
    }catch(e){ alert('Export failed:\n\n'+e.message); }
    finally{ btn.textContent=label; all.forEach(b=>b.disabled=false);
             $('#expstate').textContent=''; }
  };
});

$('#hideExcl').onchange=e=>{ localStorage.setItem('calipr_hide_excl', e.target.checked?'1':'0');
  buildTasks(); };
$('#hideExcl').checked = localStorage.getItem('calipr_hide_excl')==='1';

window.addEventListener('resize',()=>{resize();draw();drawRef();});
function resize(){ document.getElementById('app').style.height=window.innerHeight+'px'; // pin to real visible height
  const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height; }

// ---- reference panel ----
let refAnnot=new Image(), refBase=new Image(), refData=null, refMode='zoom';
const rcv=$('#refcv'), rctx=rcv.getContext('2d');
async function loadRef(){
  try{ refData=await api('/ui/reference.json'); }catch(e){ return; }
  refAnnot.onload=()=>drawRef(); refAnnot.src='/ui/reference_annot.jpg';
  refBase.src='/ui/reference_base.jpg';
}
// The region of the reference to show, in reference-image pixels. Framing the
// STRUCTURE rather than applying a fixed magnification is what makes this
// resolution-independent: a fixed zoom crops the same number of source pixels
// whatever the reference's size, so improving the reference's resolution made the
// crop a smaller fraction of the fish instead of a sharper picture of it.
function refRegionFor(task){
  if(!task||!refData) return null;
  const span = refData.w || 3600;
  if(task.kind==='keypoint'){
    const p=refData.keypoints[task.name]; if(!p) return null;
    const r=0.055*span;                      // ~5% of the fish either side
    return {cx:p[0], cy:p[1], w:2*r, h:2*r};
  }
  if(task.kind==='polygon'){
    const v=refData.polygons[task.name]; if(!v||!v.length) return null;
    const xs=v.map(p=>p[0]), ys=v.map(p=>p[1]);
    const x0=Math.min(...xs), x1=Math.max(...xs);
    const y0=Math.min(...ys), y1=Math.max(...ys);
    const pad=0.30*Math.max(x1-x0, y1-y0);   // show the fin in its context
    return {cx:(x0+x1)/2, cy:(y0+y1)/2, w:(x1-x0)+2*pad, h:(y1-y0)+2*pad};
  }
  return null; // ruler → overview
}
function drawRef(){
  if(!refData||!refAnnot.complete){return;}
  const W=rcv.width=rcv.clientWidth, H=rcv.height=rcv.clientHeight;
  rctx.setTransform(1,0,0,1,0,0); rctx.fillStyle='#0b0e12'; rctx.fillRect(0,0,W,H);
  const reg = refMode==='zoom' ? refRegionFor(activeTask) : null;
  const lbl=$('#reflabel');
  if(reg){ // zoomed focus on the landmark or fin
    // Fit the region to the panel, preserving aspect, and never magnify past 1:1 —
    // beyond that there is no more detail in the file, only bigger pixels.
    const fitScale=Math.min(W/reg.w, H/reg.h);
    const zoom=Math.min(fitScale, 1);
    const sw=W/zoom, sh=H/zoom;
    const sx=reg.cx-sw/2, sy=reg.cy-sh/2;
    // Smooth when upscaling; nearest-neighbour only helps at or below 1:1.
    rctx.imageSmoothingEnabled = zoom < 1 ? true : false;
    rctx.imageSmoothingQuality = 'high';
    rctx.drawImage(refBase, sx,sy, sw,sh, 0,0, W,H);
    const pt=[reg.cx, reg.cy];
    const cx=(pt[0]-sx)*zoom, cy=(pt[1]-sy)*zoom;
    if(activeTask.kind==='polygon'){
      // A crosshair on a fin's centroid says nothing useful. Draw the traced
      // outline: that is the convention the annotator is being asked to copy.
      const v=refData.polygons[activeTask.name];
      rctx.beginPath();
      v.forEach((p,i)=>{ const x=(p[0]-sx)*zoom, y=(p[1]-sy)*zoom;
        i?rctx.lineTo(x,y):rctx.moveTo(x,y); });
      rctx.closePath();
      rctx.strokeStyle='#4aa3ff'; rctx.lineWidth=2; rctx.stroke();
      rctx.fillStyle='#4aa3ff22'; rctx.fill();
      lbl.innerHTML=`<b>${activeTask.name}</b> — ${v.length} vertices on the example`;
    } else {
      rctx.beginPath();rctx.arc(cx,cy,7,0,7);rctx.strokeStyle='#ff5d6c';rctx.lineWidth=2;rctx.stroke();
      rctx.beginPath();rctx.moveTo(cx-14,cy);rctx.lineTo(cx+14,cy);rctx.moveTo(cx,cy-14);rctx.lineTo(cx,cy+14);
      rctx.strokeStyle='#ff5d6c88';rctx.stroke();
      lbl.innerHTML=`<b>${activeTask.name}</b> — where it goes on the example`;
    }
  } else { // overview
    const s=Math.min(W/refAnnot.naturalWidth,H/refAnnot.naturalHeight);
    const dw=refAnnot.naturalWidth*s, dh=refAnnot.naturalHeight*s;
    rctx.drawImage(refAnnot,(W-dw)/2,(H-dh)/2,dw,dh);
    const who=(refData&&refData.specimen||'').replace('Salvelinus_fontinalis_','')||'example';
    lbl.innerHTML = activeTask ? `Pick <b>overview→zoom</b> to focus on <b>${activeTask.name}</b>`
      : `Annotated example (${who}). Select a landmark + Zoom to focus.`;
  }
}
$('#refmode').onclick=e=>{e.stopPropagation();
  refMode=refMode==='overview'?'zoom':'overview';
  $('#refmode').textContent=refMode; drawRef();};
function setRefMin(v){
  $('#refpanel').classList.toggle('min', v);
  $('#refmin').textContent = v ? '+' : '–';
  $('#refmin').title = (v?'Restore':'Minimise')+' reference (R)';
  $('#reftitle').textContent = v ? 'Reference' : 'Reference — example fish';
  localStorage.setItem('calipr_ref_min', v?'1':'0');
  if(!v) drawRef();
}
const toggleRefMin=()=>setRefMin(!$('#refpanel').classList.contains('min'));
$('#refmin').onclick=e=>{e.stopPropagation(); toggleRefMin();};
// the whole header restores it, so a minimised panel is never a puzzle
$('#refhead').onclick=()=>{ if($('#refpanel').classList.contains('min')) setRefMin(false); };
window.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return;
  if(e.key==='r'||e.key==='R') toggleRefMin(); });
setRefMin(localStorage.getItem('calipr_ref_min')==='1');

function reviewed(name){
  if(pred.conf[name]===undefined) return;
  delete pred.conf[name]; pred.low.delete(name); renderAutoStat();
}
function renderAutoStat(){
  const el=$('#autostat'); if(!el) return;
  const n=unreviewed();
  if(!n){ el.innerHTML = pred.model ? 'All predicted points reviewed.' : ''; return; }
  const low=[...pred.low];
  el.innerHTML = `${n} unreviewed from <code>${pred.model||'model'}</code>`
    + (low.length ? `<br><b>check ${low.length}:</b> ${low.slice(0,4).join(', ')}`
                    + (low.length>4?` +${low.length-4}`:'') : '');
}
$('#autolabel').onclick=async()=>{
  if(!cur){ toast('Pick a specimen first'); return; }
  if(view!=='lateral'){ toast('Auto-label works on the lateral view'); return; }
  const placed=Object.keys(model.lateral.keypoints).length;
  if(placed && !confirm(
      `${placed} landmark(s) are already placed on this specimen.\n\n`+
      `Auto-label will overwrite them with the model's. Continue?`)) return;
  const btn=$('#autolabel'); const was=btn.textContent;
  btn.disabled=true; btn.textContent='Predicting…';
  $('#autostat').textContent='running the model (first run loads it, ~5s)…';
  try{
    const r=await api('/api/predict/'+encodeURIComponent(cur.id)+dsq());
    if(!r.ok){ toast('Auto-label unavailable: '+(r.error||'?'));
               $('#autostat').textContent=''; return; }
    pred={conf:r.confidence||{}, model:r.model||null,
          low:new Set(r.low_confidence||[])};
    for(const [nm,pt] of Object.entries(r.keypoints||{}))
      model.lateral.keypoints[nm]=[Math.round(pt[0]),Math.round(pt[1])];
    persistDraft();
    // Send the labeller straight to the least trustworthy point rather than
    // making them hunt for it.
    const first=(r.low_confidence||[])[0];
    if(first) pickByName('keypoint',first);
    buildTasks(); renderAutoStat(); draw();
    const nlow=(r.low_confidence||[]).length;
    toast(`${Object.keys(r.keypoints||{}).length} placed in ${r.elapsed||'?'}s — `
          + (nlow?`${nlow} to check`:'all confident'));
  }catch(e){ toast('Auto-label failed: '+e); $('#autostat').textContent=''; }
  finally{ btn.disabled=false; btn.textContent=was; }
};
$('#save').onclick=async()=>{
  if(!cur){toast('No specimen');return;}
  // capture the "known span" field value even if it was left at its default
  const km=parseFloat($('#knownmm').value);
  if(!isNaN(km) && (model[view].ruler.a||model[view].ruler.b)) model[view].known_mm=km;
  syncCompromise();
  const strain=(cur.id.match(/_([A-Z]{2,4})_\d+$/)||[])[1]||'';
  const out={fish_id:cur.id, metadata:{strain, source:'hand-labeled'}};
  if(pred.model){
    const n=unreviewed(), total=Object.keys(model.lateral.keypoints).length;
    if(n>=total && total>0){
      // Saving a prediction with nothing touched would launder model output
      // into the training set, where it teaches the model its own mistakes.
      if(!confirm(`Every landmark here is still exactly where the model put `+
        `them — nothing has been checked.\n\nSaving now records this as a hand `+
        `label and it WILL be used for training. Save anyway?`)) return;
    }
    // Traceable either way: which points a human moved, and which they accepted.
    out.metadata.assisted_by=pred.model;
    out.metadata.unreviewed_predictions=Object.keys(pred.conf).sort();
  }
  if(model.data_note) out.metadata.data_note=model.data_note;
  if(model.exclude&&model.exclude.length) out.metadata.exclude_traits=model.exclude;
  for(const v of ['lateral','frontal']){
    const m=model[v]; const has=Object.keys(m.keypoints).length||Object.keys(m.polygons).length;
    if(!has) continue;
    const blk={}; if(Object.keys(m.polygons).length)blk.polygons=m.polygons;
    blk.keypoints=m.keypoints;
    if(m.auto_ppm)
      blk.calibration={mode:'ticks',px_per_mm:m.auto_ppm,notes:m.auto_notes||'ruler mm-tick autocalibration'};
    else if(m.ruler.a&&m.ruler.b&&m.known_mm)
      blk.calibration={mode:'manual',point_a:m.ruler.a,point_b:m.ruler.b,known_mm:m.known_mm};
    else if(v==='lateral')
      // No ruler placed. Record that as an explicit scale-free calibration rather
      // than omitting the block: a missing calibration is rejected downstream, so
      // the landmarks would be stranded. Some series have no usable scale at all
      // (a specimen suspended mid-tank with the ruler on the near glass), and a
      // proportion study does not need one.
      blk.calibration={mode:'none',notes:'no scale reference placed'};
    out[v]=blk;
  }
  const res=await api('/api/save'+dsq(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(out)});
  if(res.ok){
    clearDraft(cur.id);
    // Report what is still short rather than refusing the save: partial fin work
    // is worth keeping, it just must not read as finished.
    const short=finGroups().map(g=>({g,st:finState(g)})).filter(x=>!x.st.done);
    toast(short.length
      ? `Saved ${res.saved} — still short: `+short.map(x=>`${x.g.fin} ${x.st.n}/${x.g.target}`).join(', ')
      : 'Saved '+res.saved+' — all four fins at target');
    loadSpecs();
  } else toast('Error: '+(res.error||'?'));
};
boot();
</script>
