function buildTasks(){
  const box=$('#tasks'); box.innerHTML='';
  const sc=SCHEMA[view]; if(!sc){return;}
  // Between datasets there is no specimen in hand. An empty model keeps the task
  // list rendering (unset) instead of throwing on model[view].
  const m=(model&&model[view])||{keypoints:{},polygons:{},ruler:{}};

  const hideEx = $('#hideExcl') && $('#hideExcl').checked;
  const mkTask=(kind,it,extra)=>{
    if(hideEx && it.excluded) return;
    const n = kind==='polygon' ? ((m.polygons[it.name]||[]).length) : 0;
    const target = (kind==='polygon' && it.target) ? it.target : 0;
    const set = kind==='polygon' ? (n >= Math.max(3, target))
              : kind==='ruler'   ? !!(m.ruler[it.name==='ruler_point_a'?'a':'b'])
              : !!m.keypoints[it.name];
    const el=document.createElement('div');
    // Predicted keypoints carry the model's confidence into the list. A point
    // that has been corrected or explicitly accepted leaves pred.conf and reads
    // as reviewed.
    const pc = kind==='keypoint' ? pred.conf[it.name] : undefined;
    const unsure   = pc!==undefined && (pc==null || pc < 0.6);
    const reviewed = set && pred.model && pc===undefined
                     && (pred.accepted.has(it.name) || pred.corrected[it.name]!==undefined);
    el.className='task'+(set?' set':'')+(target&&n&&n<target?' thin':'')
      +(unsure?' unsure':'')+(reviewed?' reviewed':'')
      +(activeTask&&activeTask.name===it.name&&activeTask.kind===kind?' active':'');
    const count = target ? `<span class="cnt">${n}/${target}</span>`
                : (pc!==undefined ? `<span class="cnt">${confText(pc)}</span>` : '');
    if(it.excluded) el.classList.add('excluded');
    el.innerHTML=`<span class="dot"></span><span class="nm">${extra||it.label||it.name}</span>`+
                 `${count}`+
                 (kind==='ruler'?'':`<span class="rn" title="Rename for this study">✎</span>`)+
                 `<span class="kind">${kind[0]}</span>`+
                 (kind==='ruler'?'':`<span class="ex" title="${it.excluded
                   ?'Put this landmark back in scope'
                   :'Not available or not relevant — leave it out of this study'}">${
                   it.excluded?'+':'×'}</span>`);
    const x=el.querySelector('.ex');
    if(x) x.onclick=ev=>{ ev.stopPropagation(); toggleExcluded(kind,it.name); };
    const rn=el.querySelector('.rn');
    if(rn) rn.onclick=ev=>{ ev.stopPropagation(); renameLandmark(it); };
    el.onclick=()=>{activeTask={kind,name:it.name,hint:it.hint,desc:it.description,
                               target:it.target||0};
      showHint(); buildTasks();};
    box.appendChild(el);
  };


  // Region grouping, always expanded. Headers are separators for scanning, not
  // controls: landmarking is a click-through task and the flow auto-advances, so
  // anything that has to be opened before it can be used is pure friction.
  const groups=groupedTasks();
  const isSet=([kind,it])=>kind==='polygon'
      ? ((m.polygons[it.name]||[]).length >= Math.max(3, it.target||0))
      : kind==='ruler' ? !!(m.ruler[it.name==='ruler_point_a'?'a':'b'])
      : !!m.keypoints[it.name];
  for(const [label,mine] of groups){
    const done=mine.filter(isSet).length;
    const h=document.createElement('div');
    h.className='grouphdr'+(done===mine.length?' done':'');
    h.innerHTML=`<span class="gn">${label}</span><span class="gc">${done}/${mine.length}</span>`;
    box.appendChild(h);
    mine.forEach(([kind,it])=>mkTask(kind,it));
  }

  // This study's own landmarks live at the end of their region, like any other;
  // adding one is offered here, where the list ends.
  const onScheme=(SCHEMA.schemes||[]).find(s=>s.name===SCHEMA.scheme && s.name!=='calipr');
  const add=document.createElement('div');
  add.className='addkp';
  add.textContent = onScheme ? `＋ add a landmark to ${onScheme.title}`
                             : '＋ add a landmark to this study';
  add.title = onScheme
    ? 'Appended to the scheme, after every point already in it, and collected by '
    + 'every study that follows the scheme. Never inserted: TPS identifies a '
    + 'landmark by its row.'
    : 'A point collected on every specimen in this study. Saved and exported '
    + 'as a coordinate — the 33 traits are defined in code and cannot use it.';
  add.onclick=addLandmark;
  box.appendChild(add);

  const tc=$('#taskcount');
  if(tc){ const all=[...box.querySelectorAll('.task')];
    tc.textContent = all.length ? `${all.filter(e=>e.classList.contains('set')).length}/${all.length}` : ''; }
}

// ---- view transform ----
// Where the open view lives in the photograph. A study that keeps one photograph
// per fish holds the head-on view in the rig's mirror, down the left of the same
// frame: opening the frontal tab on the whole frame would show the fish, with the
// mouth corners a few dozen pixels across in the corner. This is the same
// fraction the model is given (WHOLE_FRAME_CROPS in label_server.py) -- what it
// predicts is what you are looking at. Everywhere else it is the whole image, so
// nothing is hidden and a landmark can still be placed anywhere in the frame.
let frames=null, framesFor=null;          // {seam, lateral, frontal} for the open fish
function viewRegion(){
  if(view==='frontal' && frames && frames.frontal && imgW)
    return frames.frontal.slice();

}
// Asked for once per fish, because finding the seam means a pass over a
// 24-megapixel frame. A fish whose seam cannot be found has no frontal box, and
// the view opens on the whole photograph -- which is the honest picture of it.
async function loadFrames(){
  if(!cur || !(SCHEMA && SCHEMA.single_photo)){ frames=null; framesFor=null; return; }
  if(framesFor===cur.id) return;

function fit(){ if(!imgW){return;} const r=cv.getBoundingClientRect();
  if(!r.width||!r.height){ requestAnimationFrame(fit); return; }  // canvas not laid out yet
  const [rx0,ry0,rx1,ry1]=viewRegion(), rw=rx1-rx0, rh=ry1-ry0;
  const s=Math.min(r.width/rw, r.height/rh)*0.96;
  vs.scale=s; vs.ox=(r.width-rw*s)/2-rx0*s; vs.oy=(r.height-rh*s)/2-ry0*s; }
function toImg(sx,sy){return [(sx-vs.ox)/vs.scale,(sy-vs.oy)/vs.scale];}
function toScr(ix,iy){return [ix*vs.scale+vs.ox, iy*vs.scale+vs.oy];}

// A quarter-size copy of the photograph, made once while it is freshly decoded.
// The originals are 6000x4000 -- ~96 MB decoded -- and WebKit, which the labeler
// runs in, may throw that decode away under memory pressure and re-decode on
// demand, at reduced resolution when the image is being drawn small. When that
// decode fails nothing is drawn and the canvas goes black on zooming out, until
// the specimen is reopened and the image reloaded. Zoomed out, the copy is drawn
// instead, so the fragile large-image path is not used at all; zoomed in, the
// original is drawn at full resolution, so placing a landmark loses nothing.
const SMALL_FACTOR=4, USE_SMALL_BELOW=1/SMALL_FACTOR;
// Retries reset only when a different image is chosen (setView), never by the
// reload a retry itself triggers -- otherwise an image that truly cannot be drawn
// would reload in a loop.
let imgSmall=null, blankRetries=0, lastBlankCheck=0;
const BLANK_CHECK_MS=250;   // reading pixels back is not free; four checks a second
                            // still catches a black canvas before anyone notices
function buildImgSmall(){
  imgSmall=null;
  try{
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(imgW/SMALL_FACTOR)); c.height=Math.max(1,Math.round(imgH/SMALL_FACTOR));
    const x=c.getContext('2d'); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
    x.drawImage(img,0,0,c.width,c.height);
    if(!regionBlank(x,0,0,c.width,c.height)) imgSmall=c;   // only keep a copy that came out
  }catch(e){ imgSmall=null; }
}
// True when every sampled pixel in the rectangle is fully transparent: the image
// was asked for and nothing was drawn. A few points, not the whole region, so this
// costs nothing per frame; a photograph is never transparent at all of them.
function regionBlank(c,x,y,w,h){
  const cw=c.canvas.width, ch=c.canvas.height;
  const pts=[[.5,.5],[.25,.25],[.75,.25],[.25,.75],[.75,.75],[.5,.2],[.5,.8],[.2,.5],[.8,.5]];
  let seen=0;
  for(const [fx,fy] of pts){
    const px=Math.floor(x+w*fx), py=Math.floor(y+h*fy);
    if(px<0||py<0||px>=cw||py>=ch) continue;
    seen++;
    if(c.getImageData(px,py,1,1).data[3]!==0) return false;
  }
  return seen>0;
}
function draw(){
  const r=cv.getBoundingClientRect();
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  ictx.setTransform(1,0,0,1,0,0); ictx.clearRect(0,0,cvi.width,cvi.height);
  if(imgW){
    const dw=imgW*vs.scale, dh=imgH*vs.scale, small = !!imgSmall && vs.scale<=USE_SMALL_BELOW;
    ictx.imageSmoothingEnabled = small;      // smooth a shrink; crisp pixels when zoomed in
    // A lost decode can also surface as an exception rather than an empty draw;
    // either way the photograph is missing, so both lead to the same recovery.
    let threw=false;
    try{ ictx.drawImage(small?imgSmall:img, vs.ox, vs.oy, dw, dh); }catch(e){ threw=true; }
    // If the photograph was drawn and nothing appeared, the decode was lost:
    // reload the image rather than leave a black canvas. Bounded, so an image
    // that genuinely cannot be drawn does not reload forever.
    const now=performance.now();
    const due = now-lastBlankCheck >= BLANK_CHECK_MS;
    if(due) lastBlankCheck=now;
    if((threw || due) && blankRetries<2 && cur && (threw || regionBlank(ictx, vs.ox, vs.oy, dw, dh))){
      blankRetries++;
      console.warn(`image drew blank (${small?'small copy':'original'}, scale ${vs.scale.toFixed(3)}); reloading it`);
      const keep={ox:vs.ox, oy:vs.oy, scale:vs.scale};
      loadImage().then(()=>{ vs.ox=keep.ox; vs.oy=keep.oy; vs.scale=keep.scale; draw(); });
    }
  }
  const m=model?model[view]:null; if(m){

    // A polygon the study has stopped collecting is not drawn over the fish.
    // Only the drawing stops: it stays in the sidecar exactly as traced, it is
    // still listed (struck through, unless "hide excluded" is on), and clicking
    // it there shows it again. 59 of these fish carry a body outline somebody
    // traced by hand, and none of that is thrown away by hiding it.
    const excludedPoly=new Set(((SCHEMA&&SCHEMA[view]&&SCHEMA[view].polygons)||[])
                               .filter(p=>p.excluded).map(p=>p.name));
    for(const [nm,verts] of Object.entries(m.polygons)){
      if(!verts||!verts.length) continue;
      if(excludedPoly.has(nm) && !(activeTask&&activeTask.kind==='polygon'
                                   &&activeTask.name===nm)) continue;
      ctx.beginPath();
      verts.forEach((p,i)=>{const [x,y]=toScr(p[0],p[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      const active=activeTask&&activeTask.kind==='polygon'&&activeTask.name===nm;
      if(!active||verts.length>=3) ctx.closePath();
      ctx.strokeStyle=active?'#7fd0ff':'#4aa3ff88'; ctx.lineWidth=active?2.5:1.5; ctx.stroke();
      // An outline the model drew is tinted green until it is edited, the same
      // language the keypoints use for "placed by the model, not yet yours".
      const fromModel = pred.polys.has(nm);
      ctx.fillStyle = fromModel ? '#37c8711f'
                    : (active?'#7fd0ff2e':'#4aa3ff1a');
      if(verts.length>=3) ctx.fill();
      verts.forEach(p=>dot(p,active?'#7fd0ff':'#4aa3ff',active?3:2.5));
      if(active){ let cx=0,cy=0; verts.forEach(p=>{cx+=p[0];cy+=p[1];});
        label([cx/verts.length, cy/verts.length], labelOf(nm)); }   // name the selected polygon
    }
    // keypoints — only label the ACTIVE landmark or the one under the cursor,
    // so placed labels don't pile up and obscure the fish.
    const kpc=getComputedStyle(document.documentElement).getPropertyValue('--kp');
    // A landmark the study has stopped collecting is not drawn, for the same
    // reason an excluded outline is not: it is not being worked on and it sits
    // on top of the ones that are. The coordinate stays in the sidecar, the
    // entry stays in the list struck through, and selecting it draws it again.
    const excludedKp=new Set(((SCHEMA&&SCHEMA[view]&&SCHEMA[view].keypoints)||[])
                             .filter(k=>k.excluded).map(k=>k.name));
    for(const [nm,p] of Object.entries(m.keypoints)){
      if(excludedKp.has(nm) && !(activeTask&&activeTask.kind==='keypoint'
                                 &&activeTask.name===nm) && nm!==hoverName) continue;
      // An unreviewed prediction is drawn by the model's own confidence: green
      // where it is sure, orange where it is not. Touching the point returns it
      // to the normal colour, so what stays coloured is what still needs a look.
      const c = pred.conf[nm];
      const isAcc = pred.accepted.has(nm);
      const isCor = pred.corrected[nm]!==undefined;
      const fill = c!==undefined ? (c!=null && c>=0.6?'#37c871':'#ffb454')
                 : isAcc ? '#2f8f57'          // confirmed: muted green, work done
                 : kpc;                        // corrected or hand-placed
      dot(p, fill, c===undefined ? 3.5 : 4.5);
      if(isCor){                                // show what the model had said
        const o=pred.orig[nm];
        if(o){ const [ox,oy]=toScr(o[0],o[1]), [nx,ny]=toScr(p[0],p[1]);
          ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(nx,ny);
          ctx.strokeStyle='#ff5d6c66'; ctx.lineWidth=1; ctx.stroke();
          ctx.beginPath(); ctx.arc(ox,oy,2,0,7); ctx.fillStyle='#ff5d6c66'; ctx.fill(); } }
      if(c!==undefined && (c==null || c<0.6)){   // ring the ones worth checking
        const [sx,sy]=toScr(p[0],p[1]);
        ctx.beginPath(); ctx.arc(sx,sy,8,0,7);
        ctx.strokeStyle='#ffb454'; ctx.lineWidth=1.5; ctx.stroke(); }
      if(nm===(activeTask&&activeTask.name) || nm===hoverName)
        label(p, c===undefined ? labelOf(nm) : `${labelOf(nm)} ${confText(c)}`); }
    // ruler
    if(m.ruler.a&&m.ruler.b){ const a=toScr(...m.ruler.a),b=toScr(...m.ruler.b);
      ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
      ctx.strokeStyle='#c07bff';ctx.lineWidth=1.5;ctx.stroke(); }

    if(m.ruler.b) dot(m.ruler.b,'#c07bff',3.5);

  // One screen pixel covers 1/scale image pixels, and that is the floor on
  // placement precision however steady the hand. Fitted to a 4400px crop it is
  // several image pixels, so a point placed without zooming is imprecise by
  // construction rather than by carelessness — and nothing said so.
  const perPx = vs.scale>0 ? 1/vs.scale : 0;
  const coarse = perPx > COARSE_PX;
  const hud=$('#hud');
  $('#viewname').textContent = cur ? `${shortId(cur.id)} · ${view}` : 'No specimen';
  hud.textContent=`${cur?cur.id.replace('Salvelinus_fontinalis_',''):'—'} · ${view} · `+
    `${(vs.scale*100|0)}% · ±${perPx.toFixed(1)}px`+(coarse?' — zoom in to place accurately':'');
  hud.style.color = coarse ? 'var(--warn)' : '';
}
function dot(p,color,rr){const [x,y]=toScr(p[0],p[1]);ctx.beginPath();ctx.arc(x,y,rr,0,7);
  ctx.fillStyle=color;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#000a';ctx.stroke();}
function label(p,t){const [x,y]=toScr(p[0],p[1]);ctx.font='10px sans-serif';
  ctx.fillStyle='#000a';ctx.fillRect(x+5,y-6,ctx.measureText(t).width+4,11);
  ctx.fillStyle='#fff';ctx.fillText(t,x+7,y+3);}

let warnedCoarse=false;
function place(ix,iy){
  if(!activeTask){toast('Pick a landmark first');return;}
  if(!warnedCoarse && vs.scale>0 && 1/vs.scale > COARSE_PX){
    warnedCoarse=true;
    toast(`Zoomed out — each click lands within ~${(1/vs.scale).toFixed(0)} image px. `+
          `Scroll to zoom in for accurate placement.`);
  }
  const m=model[view], t=activeTask, pt=[Math.round(ix),Math.round(iy)];
  if(t.kind==='keypoint'){ m.keypoints[t.name]=pt; reviewed(t.name);
    warnOverlap(t.name,pt); advance(); }
  else if(t.kind==='ruler'){ const key=t.name==='ruler_point_a'?'a':'b'; m.ruler[key]=pt;
    if(t.name==='ruler_point_a'){activeTask=null;pickByName('ruler','ruler_point_b');} else advance(); }
  else if(t.kind==='polygon'){ pred.polys.delete(t.name);
    const arr=m.polygons[t.name]||(m.polygons[t.name]=[]);
    const e = arr.length>=3 ? findEdgeAt(ix,iy,t.name) : null;
    if(e){ arr.splice(e.index,0,pt); toast('Inserted vertex — drag to adjust'); }  // click on outline
    else arr.push(pt); }                                                            // extend the trace

}
function warnOverlap(name,pt){
  const m=model[view];
  for(const [nm,p] of Object.entries(m.keypoints)){
    if(nm!==name && Math.abs(p[0]-pt[0])<4 && Math.abs(p[1]-pt[1])<4){
      toast(`⚠ on top of ${nm} — select it + press Z to undo`); return; }
  }
}
// Undo acts on the CURRENTLY SELECTED landmark: clears its point (or pops the
// last vertex for a polygon) and keeps it selected so you can re-place it.
function undo(){
  if(!activeTask){ toast('Select the landmark you want to undo'); return; }
  const m=model[view], t=activeTask;
  if(t.kind==='polygon'){ const arr=m.polygons[t.name];
    if(arr&&arr.length){ arr.pop(); pred.polys.delete(t.name);
      if(!arr.length){ delete m.polygons[t.name]; forgetPrediction(t.name); }
      toast('Removed a vertex of '+t.name); }
    else toast(t.name+': no vertex to undo'); }
  else if(t.kind==='keypoint'){ if(m.keypoints[t.name]){ delete m.keypoints[t.name];
      forgetPrediction(t.name); toast('Cleared '+t.name); }
    else toast(t.name+' isn’t placed'); }
  else if(t.kind==='ruler'){ const k=t.name==='ruler_point_a'?'a':'b';
    if(m.ruler[k]){ m.ruler[k]=undefined; toast('Cleared '+t.name); } else toast(t.name+' isn’t placed'); }

}
function pickByName(kind,name){const it=(SCHEMA[view][kind==='ruler'?'ruler':kind+'s']||[]).find(x=>x.name===name);
  if(it){activeTask={kind,name,hint:it.hint,desc:it.description};showHint();buildTasks();}}
// The list as it is shown: regions down the fish, front to back. A scheme carries
// its own grouping; caliPr's is by where the landmark sits, and the order is the
// order someone works in — head, pectoral, dorsal, pelvic, anal, then the peduncle
// and caudal at the back.
function regionsFor(sc){
  if((sc.keypoints||[]).some(k=>k.group))
    return [['ruler', n=>/^ruler_/.test(n)],
            ...[...new Set((sc.keypoints||[]).map(k=>k.group))].map(g=>
              [g, n=>((sc.keypoints||[]).find(k=>k.name===n)||{}).group===g]),
            ['other', ()=>true]];
  return [
    ['ruler',    n=>/^ruler_/.test(n)],
    ['head',     n=>/^(eye_|premaxilla|maxilla|lower_jaw|operculum|snout)/.test(n)],
    ['pectoral', n=>/^pectoral/.test(n)],
    ['dorsal',   n=>/^dorsal/.test(n)],
    ['pelvic',   n=>/^pelvic/.test(n)],
    ['anal',     n=>/^anal/.test(n)],
    ['peduncle', n=>/^(peduncle|caudal)/.test(n)],
    ['body',     ()=>true],
  ];
}
// [[region, [[kind, item], ...]], ...] in the order the list shows them.
function groupedTasks(){
  const sc=SCHEMA[view];
  const all=[...(sc.ruler||[]).map(i=>['ruler',i]),
             ...(sc.keypoints||[]).map(i=>['keypoint',i]),
             ...(sc.polygons||[]).map(i=>['polygon',i])];
  const used=new Set(), out=[];
  for(const [label,test] of regionsFor(sc)){
    const mine=all.filter(([k,it])=>!used.has(it.name) && test(it.name));
    if(!mine.length) continue;
    mine.forEach(([,it])=>used.add(it.name));
    out.push([label, mine]);
  }
  return out;
}
// Flat, same order: what A walks and what placing a point advances through.
function taskOrder(){
  return groupedTasks().flatMap(([,items])=>items);
}
// Move to the NEXT task in list order — not the next empty one. Landmarks are
// often skipped deliberately (obscured, damaged, not applicable), and jumping
// back to them would fight the labeler instead of following the list.
function advance(){
  const order=taskOrder();
  const i=order.findIndex(([kind,it]) =>
      activeTask && kind===activeTask.kind && it.name===activeTask.name);
  const nxt=order[i+1];
  if(!nxt){ activeTask=null; showHint(); return; }
  const [kind,it]=nxt;
  activeTask={kind,name:it.name,hint:it.hint,desc:it.description};
  showHint();
}


// ---- mouse / keyboard ----
// Find an existing point near screen (mx,my). Keypoints/ruler take priority
// over polygon vertices so you can grab a landmark that sits on the outline.
function findPointAt(mx,my,thresh=12){
  const m=model?model[view]:null; if(!m) return null;
  let best=null, bd=thresh;
  for(const [nm,p] of Object.entries(m.keypoints)){
    const [sx,sy]=toScr(p[0],p[1]);
    const d=Math.hypot(sx-mx,sy-my); if(d<bd){bd=d;best={kind:'keypoint',name:nm};} }
  for(const k of ['a','b']){ const p=m.ruler[k]; if(!p)continue; const [sx,sy]=toScr(p[0],p[1]);
    const d=Math.hypot(sx-mx,sy-my); if(d<bd){bd=d;best={kind:'ruler',key:k};} }
  if(best) return best;
  bd=thresh;
  for(const [nm,verts] of Object.entries(m.polygons)){
    verts.forEach((p,i)=>{ const [sx,sy]=toScr(p[0],p[1]);
    const d=Math.hypot(sx-mx,sy-my); if(d<bd){bd=d;best={kind:'polyvtx',name:nm,index:i};} }); }
  return best;
}
function moveDrag(t,ix,iy){ const m=model[view], pt=[Math.round(ix),Math.round(iy)];
  if(t.kind==='keypoint') m.keypoints[t.name]=pt;
  else if(t.kind==='ruler') m.ruler[t.key]=pt;
  else if(t.kind==='polyvtx') m.polygons[t.name][t.index]=pt; }
function dragName(t){ return t.kind==='ruler'?('ruler_point_'+t.key)
  : t.kind==='polyvtx'?(t.name+' vertex') : t.name; }
// distance (image space) from point p to segment a-b
function distToSeg(p,a,b){ const vx=b[0]-a[0],vy=b[1]-a[1], wx=p[0]-a[0],wy=p[1]-a[1];
  const c1=vx*wx+vy*wy; if(c1<=0) return Math.hypot(wx,wy);
  const c2=vx*vx+vy*vy; if(c2<=c1) return Math.hypot(p[0]-b[0],p[1]-b[1]);
  const t=c1/c2; return Math.hypot(p[0]-(a[0]+t*vx), p[1]-(a[1]+t*vy)); }
// If (ix,iy) is within ~8 screen-px of an edge of the given (closed) polygon,
// return the index at which to splice a new vertex; else null.
function findEdgeAt(ix,iy,polyName){
  const verts=model[view].polygons[polyName]; if(!verts||verts.length<3) return null;
  const threshImg=8/Math.max(vs.scale,1e-6); let best=null, bd=threshImg;
  for(let i=0;i<verts.length;i++){ const d=distToSeg([ix,iy],verts[i],verts[(i+1)%verts.length]);
    if(d<bd){ bd=d; best={index:i+1}; } }
  return best;
}

let down=null, moved=0, dragTarget=null, dragStarted=false;
cv.addEventListener('mousedown',e=>{
  const r=cv.getBoundingClientRect();
  dragTarget=findPointAt(e.clientX-r.left, e.clientY-r.top);  // grab a point if we're on one
  dragStarted=false; down=[e.clientX,e.clientY]; moved=0;
});
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  if(down){ const dx=e.clientX-down[0],dy=e.clientY-down[1]; moved+=Math.abs(dx)+Math.abs(dy);
    if(dragTarget){ if(moved>3){ dragStarted=true; const [ix,iy]=toImg(mx,my); moveDrag(dragTarget,ix,iy); draw(); }
      down=[e.clientX,e.clientY]; return; }               // dragging a point (not panning)
    vs.ox+=dx; vs.oy+=dy; down=[e.clientX,e.clientY]; draw(); return; }  // panning
  const found=findPointAt(mx,my); cv.style.cursor=found?'move':'crosshair';
  const hn=found&&found.kind==='keypoint'?found.name:null;

});
cv.addEventListener('mouseleave',()=>{ if(hoverName){hoverName=null;draw();} });
window.addEventListener('mouseup',e=>{
  if(dragTarget&&dragStarted){
    if(dragTarget.kind==='keypoint') reviewed(dragTarget.name);
    // Moving a vertex of an outline the model drew means the same as inserting
    // or removing one: a person has worked on it, so it is no longer the
    // model's outline, and it stops being excluded from what the next model
    // trains on. An outline nobody touched stays marked.

});
const ZOOM_SENS=0.0010;  // lower = less sensitive wheel zoom
cv.addEventListener('wheel',e=>{e.preventDefault(); const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top; const [ix,iy]=toImg(mx,my);
  // proportional to scroll amount (smooth across mouse/trackpad), clamped per event
  let d=e.deltaY; if(e.deltaMode===1) d*=16; else if(e.deltaMode===2) d*=r.height; // lines/pages→px

$('#clearall').onclick=clearAll;

// Ruler auto-scale: measures px/mm from the ruler's mm ticks, so calibration
// needs no clicked points and no typed span.
let autoCal=null;
async function loadAutoCal(){
  autoCal=null; $('#autotxt').textContent='detecting…';
  renderTickSummary();
  if(!cur||!cur.lateral){ $('#autotxt').textContent='';
    renderTickSummary(); return; }
  const s=cur;
  try{
    const r=await api('/api/autocal/'+encodeURIComponent(cur.lateral)+dsq());
    if(cur!==s) return;                              // another fish was opened meanwhile
    if(r && r.px_per_mm){ autoCal=r;
      $('#autotxt').textContent=`${r.px_per_mm.toFixed(2)} px/mm detected`; }
    else { $('#autotxt').textContent='auto-scale unavailable'; }
  }catch(e){ $('#autotxt').textContent='auto-scale unavailable'; }
  reserve($('#autocal'));
  renderTickSummary(); draw();
}
// ---- millimetre dots on the ruler ------------------------------------------
// The auto-scale is one number, measured from how regularly the ticks repeat.
// The dots lay that number along the ruler, one per millimetre, so whether it
// fits can be seen rather than taken on trust. A dot a whole millimetre out sits
// on the neighbouring tick and looks right, so the colour carries the drift:
// green within a quarter millimetre of its own tick, amber within a half, red
// beyond. On this rig the ruler is often nearer the camera at one end and the
// millimetres widen along it, so the dots go amber and red toward the ends.
function tickColour(off, ppm){
  const a=Math.abs(off)/ppm;
  return a<=0.25 ? '#37c871' : a<=0.5 ? '#ffb454' : '#ff5d6c';
}
// The auto-scale is measured from how regularly the ruler's ticks repeat, and
// the labeler used to draw a dot per millimetre so that fit could be seen. The
// ruler is two clicked points as far as anyone using it is concerned, so the
// dots are gone -- but the fit is still measured, and this says so on the one
// occasion it matters: when the scale does not hold and the two points should
// be placed by hand instead. Routine statistics about a scale that is working
// are not worth the room.
function renderTickSummary(){
  const el=$('#ticktxt'); if(!el) return;
  const T=autoCal && autoCal.ticks;
  const warn = t => `<b style="color:var(--kp)">${t}</b>`;
  if(!T){
    el.innerHTML = (autoCal && autoCal.ticks_error)
      ? warn(`No ruler ticks at ${autoCal.px_per_mm.toFixed(2)} px/mm`)
        + ' — this auto-scale is probably wrong; place the two ruler points instead'
      : '';
    reserve(el);
    return;
  }
  // Only the failure. How much the millimetres widen along the ruler is a
  // property of the rig rather than of a fish -- sampled over 18 of these, the
  // median is 5.2% and 13 exceed 3% -- so warning per fish would fire on most
  // of them and say nothing about the one in hand. That belongs with the
  // measurements, not over the labeller's shoulder.
  const n=T.ticks.length, on=T.within_quarter_mm;
  el.innerHTML = on < 0.3*n
      ? warn('The auto-scale does not follow this ruler')
        + ` — only ${on} of ${n} millimetres land on a tick. Place the two ruler points instead.`
      : '';
  reserve(el);
}
// Put the two ruler points down, the way Auto-label puts a landmark down.
//
// The detector already locates every millimetre tick on the ruler, so the two
// points do not have to be inferred from a spacing -- they are two ticks it
// found, and the span between them is an exact whole number of millimetres.
// That is better than the number it used to write straight into the
// calibration: the scale is now two points that can be seen, checked and
// dragged, and it is derived the same way a hand calibration is.
//
// The ends of the ruler are used rather than a short span near the fish,
// because this rig's millimetres are a median 5% wider at one end than the
// other -- averaging over the whole ruler is the best single number available.
async function applyAutoCal(){
  if(!autoCal){ toast('No auto-scale for this image'); return; }
  const T=autoCal.ticks, tk=(T && T.ticks) || [];
  if(tk.length<2 || !T.span_mm){
    toast('The ruler was found but its ticks were not, so there are no two points to place');
    return; }
  // Two points somebody clicked are not replaced without asking, the same as
  // landmarks. Its own earlier pair it may replace freely.
  const m0=model[view];
  if(m0.ruler.a && m0.ruler.b && !m0.ruler_from_ticks
     && !await ask(`Both ruler points are already placed on this fish.\n\n`
                   + `Replace them with the two the detector found, `
                   + `${T.span_mm} mm apart?`, {ok:'Replace'})) return;
  // x + off is where the real tick is; x alone is where this scale predicted it.
  const at=i=>[Math.round(tk[i][0]+tk[i][2]), Math.round(tk[i][1])];
  const m=model[view];
  m.ruler.a=at(0); m.ruler.b=at(tk.length-1);
  m.known_mm=T.span_mm;
  m.ruler_from_ticks=true;          // provenance: nobody clicked these two
  m.auto_ppm=null; m.auto_notes='';
  $('#knownmm').value=T.span_mm;
  persistDraft(); updateCalRead(); buildTasks(); draw();
  const px=Math.hypot(m.ruler.b[0]-m.ruler.a[0], m.ruler.b[1]-m.ruler.a[1]);
  toast(`Placed both ruler points ${T.span_mm} mm apart — ${(px/T.span_mm).toFixed(2)} px/mm`);
}

// Live px/mm readout — catches a mistyped known_mm (the one calibration error
// nothing downstream can detect, since the wrong scale is self-consistent).
let calMedian=null;
const lotOf = id => { const m=/CUMV[A-Za-z]*_(\d+)/i.exec(id) || /_([A-Za-z]{2,4})_\d+$/.exec(id);
  return m ? m[1] : ''; };
async function loadCalStats(){ try{
  const lot = cur ? lotOf(cur.id) : '';
  const s=await api('/api/calibstats'+dsq()+(lot?'&lot='+encodeURIComponent(lot):''));
  calMedian=s.median_px_per_mm; }catch(e){} }
// Announce a missing scale when the specimen is opened, not when the workbook is
// exported weeks later. Named, so it is obvious which fish it refers to when
// several are being worked through.
function warnIfNoScale(){
  if(!model||!cur) return;
  const m=model.lateral;
  const has = m.auto_ppm || (m.ruler.a && m.ruler.b && (m.known_mm>0 ||
                             parseFloat($('#knownmm').value)>0));
  if(!has) toast('No scale on '+cur.id.replace('Salvelinus_fontinalis_','')+
                 ' — this specimen will measure in pixels');
}
// The round span that would put this ruler in line with the rest of its lot, if
// one does. The slip it catches is two points a centimetre apart with the span
// left at its 50 mm default: ASN_48, HRN_41 and TXD_35 in one evening, each
// measuring five times too small.
function spanThatFits(px){
  if(!calMedian) return null;
  return [1,2,5,10,20,25,50,100].find(mm=>Math.abs(px/mm/calMedian-1)<0.15) || null;
}
function updateCalRead(){
  updateDefaultBtn();
  const el=$('#calread'); if(!el||!model) return;
  // Every path out of here ends in reserve(): the no-scale banner wraps to two
  // lines where a clean readout is one, and that difference used to move the
  // specimen list on every click between such fish.
  const done=()=>reserve(el);
  const m=model[view], km=parseFloat($('#knownmm').value);
  if(m.auto_ppm){ el.className='';
    el.textContent=`✓ auto-scale ${m.auto_ppm.toFixed(2)} px/mm (ruler ticks)`; return done(); }
  if(!(m.ruler.a&&m.ruler.b)||!(km>0)){
    // Unmistakable, because a specimen saved without a scale exports in PIXELS
    // and that is not visible from the numbers afterwards.
    el.className='warn';
    el.textContent='NO SCALE — measurements will be in pixels, not mm';
    return done(); }
  const px=Math.hypot(m.ruler.b[0]-m.ruler.a[0], m.ruler.b[1]-m.ruler.a[1]);
  const ppm=px/km;
  let msg=`${px.toFixed(0)} px ÷ ${km} mm = ${ppm.toFixed(2)} px/mm`;
  const off = calMedian && (ppm>calMedian*1.35 || ppm<calMedian*0.74);
  if(off){ el.className='warn';
    const fit=spanThatFits(px);
    el.innerHTML=`⚠ ${ppm.toFixed(1)} px/mm — others ≈ ${calMedian.toFixed(1)}. Check "known span".`
      + (fit && fit!==km ? ` The points are about ${fit} mm apart. `
        + `<button id="useFitSpan" type="button">Use ${fit} mm</button>` : '');
    const b=$('#useFitSpan');
    if(b) b.onclick=()=>{ $('#knownmm').value=fit; $('#knownmm').onchange(); }; }
  else { el.className=''; el.textContent=msg + (calMedian?`  (batch ≈ ${calMedian.toFixed(1)})`:''); }
  done();
}
// Display only. None of this touches a stored coordinate — it changes what the
// canvas paints, never what a click records.
let gray=false, inv=false;
function updateImgFilter(){
  const c=+$('#ctrst').value, b=+$('#brt').value,
        sa=+$('#sat').value, g=+$('#gam').value;
  $('#vCtrst').textContent=c.toFixed(2); $('#vBrt').textContent=b.toFixed(2);
  $('#vSat').textContent=sa.toFixed(2);  $('#vGam').textContent=g.toFixed(2);
  const parts=[];
  if(c!==1) parts.push(`contrast(${c})`);
  if(b!==1) parts.push(`brightness(${b})`);
  if(sa!==1) parts.push(`saturate(${sa})`);
  // Canvas has no gamma filter; brightness on a mid-grey pivot is the closest
  // thing that still lifts shadow detail without blowing the highlights.
  if(g!==1) parts.push(`brightness(${(1/g).toFixed(3)}) contrast(${g.toFixed(3)})`);
  if(gray) parts.push('grayscale(1)');
  if(inv) parts.push('invert(1)');
  imgFilter = parts.length ? parts.join(' ') : 'none';
  cvi.style.filter = parts.length ? imgFilter : '';
  $('#tGray').classList.toggle('on',gray);
  $('#tInv').classList.toggle('on',inv);
  const n=parts.length;
  $('#imgstate').textContent = n ? ` — ${n} active` : '';
  draw();
}
['#ctrst','#brt','#sat','#gam'].forEach(id=>$(id).oninput=updateImgFilter);
$('#tGray').onclick=()=>{gray=!gray;updateImgFilter();};
$('#tInv').onclick=()=>{inv=!inv;updateImgFilter();};
$('#enhReset').onclick=()=>{
  $('#ctrst').value=1;$('#brt').value=1;$('#sat').value=1;$('#gam').value=1;
  gray=false;inv=false;updateImgFilter();};
$('#datanote').oninput=()=>{ if(model){ syncCompromise(); updateDcState(); persistDraft(); } };
$('#viewPick').onchange=e=>setView(e.target.value);
async function pickDataset(name){
  if(!name || name===dataset){ renderDsMenu(); return; }
  dataset=name;
  localStorage.setItem('calipr_dataset', dataset);
  renderDsMenu();
  // A different study means a different schema, specimen list and reference, so
  // clear the in-hand specimen rather than carry one across.
  cur=null; model=blankModel(); activeTask=null; imgW=imgH=0;
  imgToken++;                    // abandon any image still loading from the old set
  SCHEMA=await api('/api/schema'+dsq());
  renderSchemePicker();
  await loadSpecs(); loadCalStats(); loadRef();
  buildTasks(); showHint(); draw();
  if(SPECS.length) await selectSpec(SPECS[0]);
  toast('Switched to '+dataset);
}
$('#knownmm').onchange=()=>{if(model){model[view].known_mm=parseFloat($('#knownmm').value);persistDraft();updateCalRead();}};
$('#knownmm').addEventListener('input', updateDefaultBtn);
$('#setDefaultMM').onclick=async()=>{
  const mm=parseFloat($('#knownmm').value); if(!(mm>0)) return;
  const r=await api('/api/schema/known_mm'+dsq(), {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({view, known_mm:mm})});
  if(!r.ok){ tell('Default not saved:\n\n'+(r.error||'?')); return; }
  SCHEMA.known_mm_default=r.known_mm_default; updateDefaultBtn();
  toast(`${mm} mm is now the default ${view} span for ${dataset}`);
};

// Tabs inside a pane, as in RStudio: one panel showing at a time, and the choice
// remembered like the collapsible sections are.
document.querySelectorAll('.tabs button.tab[data-tab]').forEach(tab=>{
  const strip=tab.parentElement, key='calipr_tab_'+strip.parentElement.id;
  const show=()=>{
    strip.querySelectorAll('button.tab[data-tab]').forEach(t=>{
      t.classList.toggle('on', t===tab);
      $('#'+t.dataset.tab).classList.toggle('on', t===tab);
    });
    try{ localStorage.setItem(key, tab.dataset.tab); }catch(e){}
  };

// Column widths: remembered, clamped, and applied before first paint so the
// canvas is measured against the real layout rather than resized after it.
const COLS = {
  '--sidew': {grip:'#grip',  key:'calipr_sidew', def:320, min:250, max:620},
  '--taskw': {grip:'#grip2', key:'calipr_taskw', def:240, min:170, max:460},
};
function setCol(varName, px){
  const c=COLS[varName];
  const w=Math.round(Math.max(c.min, Math.min(c.max, px)));
  document.documentElement.style.setProperty(varName, w+'px');
  localStorage.setItem(c.key, String(w));
  resize(); draw(); drawRef();
}
Object.entries(COLS).forEach(([v,c])=>{
  const saved=parseInt(localStorage.getItem(c.key)||'',10);
  document.documentElement.style.setProperty(v,
    Math.max(c.min, Math.min(c.max, saved||c.def))+'px');
});
Object.entries(COLS).forEach(([v,c])=>{
  const grip=$(c.grip); if(!grip) return;
  let dragging=false;
  grip.addEventListener('mousedown',e=>{ dragging=true; e.preventDefault();
    grip.classList.add('drag'); document.body.classList.add('resizing'); });
  window.addEventListener('mousemove',e=>{
    if(!dragging) return;
    // measured from the column's own left edge, so the second grip does not
    // jump when the first one has been moved
    const left=$(v==='--sidew'?'#side':'#taskcol').getBoundingClientRect().left;
    setCol(v, e.clientX-left);
  });
  window.addEventListener('mouseup',()=>{ if(!dragging) return; dragging=false;
    grip.classList.remove('drag'); document.body.classList.remove('resizing'); });
  grip.addEventListener('dblclick',()=>setCol(v, c.def));
});

// Exports are built on demand by the server, saved under results/<study>/, and
// opened on this computer by the server itself: the workbook in the spreadsheet
// app, the others selected in Finder. Not downloaded, because the browser pane in
// the Claude app offers every download to Claude instead of opening it. Only if
// the server cannot open anything (no desktop) does it fall back to a download.
// Exports can take a while on a big study, so the button says what is happening.
async function downloadExport(kind){
  const res=await fetch('/api/export/'+kind+dsq());
  if(!res.ok){
    let msg='export failed';
    try{ msg=(await res.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  const blob=await res.blob();
  const m=/filename="([^"]+)"/.exec(res.headers.get('Content-Disposition')||'');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=m?m[1]:(dataset+'_'+kind);
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Exported '+a.download+' ('+Math.round(blob.size/1024)+' KB)');
}
// Export menu, in the application toolbar where RStudio keeps its own.
function closeExpMenu(){ $('#exportbox').classList.remove('on'); }
$('#expBtn').onclick=e=>{ e.stopPropagation(); closeDsMenu();
  $('#exportbox').classList.toggle('on'); };
$('#dsBtn').addEventListener('click', ()=>closeExpMenu());
document.addEventListener('click', ()=>closeExpMenu());
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeExpMenu(); });

async function runExport(kind, opts){
  const btn=$('#expBtn');
  btn.disabled=true; $('#expstate').textContent=' — building '+kind+'…';
  try{
    const r=await api('/api/export/'+kind+dsq(),{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(opts||{})});
    // A server started before exports opened themselves has no such route.
    if(r.error==='unknown route'){ await downloadExport(kind); return; }
    if(!r.ok){ await tell('Export failed:\n\n'+(r.error||'?')); return; }
    if(r.note) await tell('Saved '+r.path+'\n\n'+r.note);
    else if(r.shown==='open') toast('Opened '+r.path);
    else if(r.shown==='reveal') toast('Saved '+r.path+' — shown in '+(r.shown_in||'Finder'));
    else await downloadExport(kind);
  }catch(e){ tell('Export failed:\n\n'+e.message); }
  finally{ btn.disabled=false; $('#expstate').textContent=''; }
}
document.querySelectorAll('#exportbox button[data-exp]').forEach(item=>{
  item.onclick=e=>{ e.stopPropagation(); closeExpMenu();
    if(item.dataset.exp==='measurements') exportPreview();
    else if(item.dataset.exp==='tps') rExportDialog();
    else runExport(item.dataset.exp); };
});

// ---- annotations for R: which layout -----------------------------------------
// A folder with one file per specimen is what a series-by-files workflow in R
// reads (the ImageJ layout: landmark 1..N, Label, X, Y). The geomorph bundle is
// one .tps holding every specimen. The choice is remembered per study.
function rExportDialog(){
  const key='calipr_rexport_'+dataset;
  let saved={}; try{ saved=JSON.parse(localStorage.getItem(key)||'{}'); }catch(e){}
  const fmt=saved.format==='geomorph'?'geomorph':'per_specimen', units=saved.units==='mm'?'mm':'cm';
  let root=document.getElementById('dlg');
  if(!root){ root=document.createElement('div'); root.id='dlg'; document.body.appendChild(root); }
  root.innerHTML=`<div class="box">
    <div class="msg"><b>Annotations for R</b> — the landmark coordinates of every labelled specimen</div>
    <label class="opt"><input type="radio" name="rfmt" value="per_specimen" ${fmt==='per_specimen'?'checked':''}>
      <span><b>One file per specimen</b><br><small>a folder of CSVs laid out as ImageJ writes them —
      landmark 1–N, Label, X, Y — with a landmark key, a table of specimens and a script that
      reads the folder into geomorph for Procrustes and PCA</small></span></label>
    <label class="opt"><input type="radio" name="rfmt" value="geomorph" ${fmt==='geomorph'?'checked':''}>
      <span><b>geomorph bundle</b><br><small>one .tps with every specimen, the same points as a single
      ImageJ-style table, and a starter analysis</small></span></label>
    <label class="units">Units <select id="rUnits">
      <option value="cm" ${units==='cm'?'selected':''}>cm (as ImageJ is usually set)</option>
      <option value="mm" ${units==='mm'?'selected':''}>mm</option></select>
      <small>per-specimen files only</small></label>
    <div class="btns"><button class="cancel" type="button">Cancel</button>
      <button class="ok" type="button">Export</button></div></div>`;
  root.classList.add('on');
  const sync=()=>{ $('#rUnits').disabled = root.querySelector('input[name=rfmt]:checked').value!=='per_specimen'; };
  root.querySelectorAll('input[name=rfmt]').forEach(r=>r.onchange=sync); sync();
  const close=()=>{ root.classList.remove('on'); root.innerHTML='';
    document.removeEventListener('keydown',keys,true); };
  const go=()=>{ const opts={format:root.querySelector('input[name=rfmt]:checked').value, units:$('#rUnits').value};
    try{ localStorage.setItem(key, JSON.stringify(opts)); }catch(e){}
    close(); runExport('tps', opts); };
  const keys=e=>{ if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
                  else if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); go(); } };
  document.addEventListener('keydown',keys,true);
  root.querySelector('.cancel').onclick=close;
  root.querySelector('.ok').onclick=go;
}

// ---- export preview ---------------------------------------------------------
// The measurements are shown before they are written, the way View() shows a
// data frame, with every column's count of fish that have no value in it. A PCA
// in R throws out every row with an NA, so a column most fish lack costs most of
// the rows; leaving it out here keeps them. The choice is remembered per study,
// and the workbook's About sheet records it.
async function exportPreview(){
  const btn=$('#expBtn');
  btn.disabled=true; $('#expstate').textContent=' — measuring…';
  let d;
  try{ d=await api('/api/export/preview'+dsq()); }
  catch(e){ d={ok:false, error:e.message}; }
  finally{ btn.disabled=false; $('#expstate').textContent=''; }
  // A server started before the preview existed: export as before.
  if(d.ok===undefined && /unknown (export|route)/.test(d.error||'')){
    toast('Restart the labeler server to preview exports — exporting every column');
    return runExport('measurements');
  }
  if(!d.ok){ await tell('Could not measure this study:\n\n'+(d.error||'?')); return; }

  const key='calipr_export_'+dataset;
  let saved={}; try{ saved=JSON.parse(localStorage.getItem(key)||'{}'); }catch(e){}
  const cols=d.columns, rows=d.rows, N=rows.length;
  const off=new Set((saved.leave_out||[]).filter(c=>cols.some(k=>k.code===c)));
  let complete=!!saved.complete_only, filter='all';
  const fmt0 = saved.format==='csv' ? 'csv' : 'xlsx';
  const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const kept=()=>cols.map((c,i)=>i).filter(i=>!off.has(cols[i].code));
  const blankIn=(r,ks)=>ks.some(i=>r.values[i]===null);
  const tone=m=> m===0 ? 'z' : m/N<=0.1 ? 'lo' : m/N<=0.3 ? 'mid' : 'hi';

  const root=document.createElement('div'); root.id='xp';
  root.innerHTML=`<div class="win" role="dialog" aria-label="Export measurements">
    <div class="xhead">Export Measurements <span>${esc(dataset)} · ${N} specimens · ${cols.length} ${d.what||'traits'}</span></div>
    <div class="xbody">
      <div class="xside">
        <div class="xsec">
          <div class="xlab">Leave out columns with more than</div>
          <div class="xrow"><input type="number" id="xpT" min="0" max="${N}" value="${saved.threshold ?? Math.round(N*0.2)}">
            <span>blanks</span><button id="xpApply" type="button">Apply</button></div>
          <div class="xrow xlinks"><a id="xpAll">keep all</a><a id="xpNone">leave out all</a></div>
        </div>
        <div class="xcols${cols.some(c=>c.code.length>6)?' long':''}" id="xpCols"></div>
        <label class="xsec xchk"><input type="checkbox" id="xpComplete">
          <span>Complete rows only<br><small>leave out every fish with a blank in a kept column</small></span></label>
      </div>
      <div class="xmain">
        <div class="xbar"><span id="xpSum"></span><span class="spacer"></span>
          <label>Show <select id="xpFilter">
            <option value="all">all specimens</option>
            <option value="blank">specimens with a blank</option>
            <option value="complete">complete specimens</option></select></label></div>
        <div class="xgrid" id="xpGrid"></div>
      </div>
    </div>
    <div class="xfoot"><span class="xnote">Click a specimen to open it and fill its gaps.</span>
      <span class="spacer"></span>
      <label class="xfmt">Format <select id="xpFmt">
        <option value="xlsx">Excel workbook (.xlsx)</option>
        <option value="csv">CSV (.csv)</option></select></label>
      <button id="xpCancel" type="button">Cancel</button>
      <button id="xpGo" type="button" class="primary">Export</button></div>
  </div>`;
  document.body.appendChild(root);

  const render=()=>{
    const ks=kept();
    $('#xpCols').innerHTML=cols.map(c=>
      `<label class="xc ${off.has(c.code)?'off':''}" title="${esc(c.label)}: ${c.missing} of ${N} blank">`
      + `<input type="checkbox" data-code="${esc(c.code)}" ${off.has(c.code)?'':'checked'}>`
      + `<code>${esc(c.code)}</code><span class="lb">${esc(c.label)}</span>`
      + `<span class="ms ${tone(c.missing)}">${c.missing}</span>`
      + `<span class="bar"><i class="${tone(c.missing)}" style="width:${(100*c.missing/N).toFixed(1)}%"></i></span></label>`).join('');
    $('#xpCols').querySelectorAll('input').forEach(b=>b.onchange=()=>{
      b.checked ? off.delete(b.dataset.code) : off.add(b.dataset.code); render(); });
    const full=rows.filter(r=>!blankIn(r,ks)).length;
    $('#xpSum').innerHTML=`<b>${ks.length}</b> of ${cols.length} columns · `
      + `<b>${full}</b> of ${N} specimens complete — `
      + (complete ? `<b>${full}</b> rows will be exported`
                  : `all ${N} rows will be exported, ${N-full} with a blank`);
    $('#xpComplete').checked=complete;
    const shown=rows.filter(r=> filter==='all' || (filter==='blank') === blankIn(r,ks));
    const th=cols.map(c=>`<th class="num${off.has(c.code)?' off':''}" title="${esc(c.label)} — ${c.missing} blank">`
      + `${esc(c.code)}<small class="${tone(c.missing)}">${c.missing||''}</small></th>`).join('');
    const body=shown.map((r,n)=>{
      const gone=complete && blankIn(r,ks);
      return `<tr class="${gone?'gone':''}"><td class="rn">${n+1}</td>`
        + `<td class="id"><a data-id="${esc(r.id)}">${esc(shortId(r.id))}</a></td>`
        + `<td>${esc(r.group)}</td><td class="${r.units==='px'?'px':''}">${esc(r.units)}</td>`
        + r.values.map((v,i)=>`<td class="num${off.has(cols[i].code)?' off':''}${v===null?' na':''}">`
          + (v===null?'NA':esc(v))+'</td>').join('') + '</tr>';
    }).join('');
    $('#xpGrid').innerHTML=`<table><thead><tr><th class="rn"></th><th>specimen</th><th>group</th>`
      + `<th>units</th>${th}</tr></thead><tbody>`
      + (body || `<tr><td colspan="${cols.length+4}" class="empty">none</td></tr>`) + `</tbody></table>`;
    $('#xpGrid').querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>{
      const s=SPECS.find(x=>x.id===a.dataset.id); if(!s) return;
      close(); selectSpec(s); });
  };
  const close=()=>{ root.remove(); document.removeEventListener('keydown',keys,true); };
  const keys=e=>{ if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); } };
  document.addEventListener('keydown',keys,true);
  $('#xpApply').onclick=()=>{ const t=parseInt($('#xpT').value,10); if(isNaN(t)) return;
    off.clear(); cols.forEach(c=>{ if(c.missing>t) off.add(c.code); }); render(); };
  $('#xpAll').onclick=()=>{ off.clear(); render(); };
  $('#xpNone').onclick=()=>{ cols.forEach(c=>off.add(c.code)); render(); };
  $('#xpComplete').onchange=e=>{ complete=e.target.checked; render(); };
  $('#xpFilter').onchange=e=>{ filter=e.target.value; render(); };
  $('#xpFmt').value=fmt0;
  $('#xpCancel').onclick=close;
  root.onclick=e=>{ if(e.target===root) close(); };
  $('#xpGo').onclick=()=>{
    if(!kept().length){ toast('Keep at least one column'); return; }
    const opts={leave_out:[...off], complete_only:complete, format:$('#xpFmt').value};
    try{ localStorage.setItem(key, JSON.stringify({...opts,
      threshold:parseInt($('#xpT').value,10)})); }catch(e){}
    close(); runExport('measurements', opts);
  };
  render();
}

// ---- specimen records (Darwin Core) ------------------------------------------
// Which museum specimen each photograph is: institution, catalogue number,
// species, sex, where and when it was collected -- under Darwin Core's term
// names, so a measurement can be joined back to the collection's own record.
// Kept per study in darwin_core.csv and carried into every export. What the
// filenames suggest is shown greyed and written only when accepted.
let DWC=null, DWC_ERR='';
const DWC_WIDE=new Set(['occurrenceID','locality','associatedMedia','recordedBy','license']);
const DWC_MID=new Set(['scientificName','fieldNumber','stateProvince','county','basisOfRecord']);
const DWC_NARROW=new Set(['sex','lifeStage','institutionCode','collectionCode','eventDate','country']);
async function loadDwc(){
  const want=dataset;
  let d=null, err='';
  try{ const r=await fetch('/api/dwc'+dsq());
       if(r.ok) d=await r.json();
       else err = r.status===404
         ? 'The labeler server was started before specimen records existed. Restart it, then reload this page.'
         : `The server could not read this study's records (HTTP ${r.status}).`; }
  catch(e){ err='The labeler server is not answering.'; }
  if(want!==dataset) return;                 // switched study while this was loading
  DWC = d && d.terms ? d : null;
  DWC_ERR = DWC ? '' : (err || 'Specimen records are not available.');
  $('#recsec').hidden=!DWC;
  showRecord();
}
function dwcBrief(rec){
  const id=[rec.institutionCode, rec.catalogNumber].filter(Boolean).join(' ');
  return [id, rec.scientificName, rec.sex].filter(Boolean).join(' · ');
}
function showRecord(){
  if(!DWC) return;
  const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const id=cur && cur.id, rec=(id && DWC.records[id]) || {}, sug=(id && DWC.suggestions[id]) || {};
  const have=DWC.terms.filter(t=>rec[t.term]);
  $('#recstate').textContent = !id ? '' : (have.length ? dwcBrief(rec) || `${have.length} terms` : 'none');
  if(!id){ $('#recbody').innerHTML='Select a specimen.'; return; }
  let h = have.length
    ? '<dl>'+have.map(t=>`<dt title="${esc(t.help)}">${esc(t.term)}</dt><dd>${esc(rec[t.term])}</dd>`).join('')+'</dl>'
    : '<div>No record for this specimen yet.</div>';
  const s=Object.entries(sug);
  if(s.length) h+=`<div>The filename suggests ${s.map(([t,v])=>`${esc(t)} <b>${esc(v)}</b>`).join(', ')}.
    <a id="recAccept">Accept</a></div>`;
  h+=`<div><a id="recEdit">${have.length?'Edit':'Add one'} in the records table</a></div>`;
  $('#recbody').innerHTML=h;
  $('#recEdit').onclick=()=>recordsDialog(id);
  if($('#recAccept')) $('#recAccept').onclick=async()=>{
    const r=await dwcPost('/api/dwc', {changes:{[id]:sug}});
    if(r) toast(`Recorded ${Object.keys(sug).join(', ')} for ${shortId(id)}`);
  };
}
async function dwcPost(url, body){
  let r;
  try{ r=await api(url+dsq(), {method:'POST', headers:{'Content-Type':'application/json'},
                               body:JSON.stringify(body)}); }
  catch(e){ r={ok:false, error:e.message}; }
  if(r.ok===undefined && /unknown route/.test(r.error||''))
    r.error='Restart the labeler server to use specimen records.';
  if(!r.ok){ if(!r.plan) await tell(r.error||'Nothing was written.'); return r.plan ? r : null; }
  if(r.records){ DWC.records=r.records;
    for(const [f,rec] of Object.entries(r.records)) if(DWC.suggestions[f]){
      for(const t of Object.keys(rec)) delete DWC.suggestions[f][t];
      if(!Object.keys(DWC.suggestions[f]).length) delete DWC.suggestions[f]; }
    showRecord(); }
  return r;
}
function toBase64(buf){
  const b=new Uint8Array(buf); let out='';
  for(let i=0;i<b.length;i+=0x8000) out+=String.fromCharCode.apply(null, b.subarray(i,i+0x8000));
  return btoa(out);
}

// ---- reference panel ----
let refAnnot=new Image(), refBase=new Image(), refData=null, refMode='zoom', refOwn=false;
const VIEWER_BG=getComputedStyle(document.documentElement).getPropertyValue('--viewer').trim()||'#eef0f2';
const rcv=$('#refcv'), rctx=rcv.getContext('2d');
// The example is the study's own when it has one (made with "Use as example",
// kept in <study>/reference/). Otherwise the built-in brook trout -- but only for
// a study on caliPr's own landmarks: shown to a study on another scheme, it
// pointed at landmarks that study does not have.
async function loadRef(){
  refData=null; refOwn=false;
  let d=null, base='/ui/', sfx='';
  try{ const r=await fetch('/api/reference/reference.json'+dsq());
       if(r.ok){ d=await r.json(); base='/api/reference/'; sfx=dsq()+'&t='+Date.now(); refOwn=true; } }catch(e){}
  if(!d && !(SCHEMA && SCHEMA.scheme && SCHEMA.scheme!=='calipr')){
    try{ d=await api('/ui/reference.json'); }catch(e){} }

  if(!d){ drawRef(); return; }
  refAnnot.onload=()=>drawRef(); refAnnot.src=base+'reference_annot.jpg'+sfx;
  refBase.onload=()=>drawRef();  refBase.src=base+'reference_base.jpg'+sfx;
}
function refTitle(){
  const min=$('#refpanel').classList.contains('min');
  const who=refData && refData.specimen ? shortId(refData.specimen) : '';
  $('#reftitle').textContent = min ? 'Reference'
    : (who ? `Reference — ${who}${refOwn?'':' (built-in)'}` : 'Reference — no example yet');
}
// The region of the reference to show, in reference-image pixels. Framing the
// STRUCTURE rather than applying a fixed magnification is what makes this
// resolution-independent: a fixed zoom crops the same number of source pixels
// whatever the reference's size, so improving the reference's resolution made the
// crop a smaller fraction of the fish instead of a sharper picture of it.
function refRegionFor(task){
  if(!task||!refData) return null;
  const span = refData.w || 3600;
  if(task.kind==='keypoint'){
    const p=refData.keypoints[task.name]; if(!p) return null;
    const r=0.055*span;                      // ~5% of the fish either side
    return {cx:p[0], cy:p[1], w:2*r, h:2*r};
  }
  if(task.kind==='polygon'){
    const v=refData.polygons[task.name]; if(!v||!v.length) return null;
    const xs=v.map(p=>p[0]), ys=v.map(p=>p[1]);
    const x0=Math.min(...xs), x1=Math.max(...xs);
    const y0=Math.min(...ys), y1=Math.max(...ys);
    const pad=0.30*Math.max(x1-x0, y1-y0);   // show the fin in its context
    return {cx:(x0+x1)/2, cy:(y0+y1)/2, w:(x1-x0)+2*pad, h:(y1-y0)+2*pad};
  }
  return null; // ruler → overview
}
function drawRef(){
  if(!refData){
    const W=rcv.width=rcv.clientWidth, H=rcv.height=rcv.clientHeight;
    rctx.setTransform(1,0,0,1,0,0); rctx.fillStyle=VIEWER_BG; rctx.fillRect(0,0,W,H);
    $('#reflabel').innerHTML='No example for this study yet. Open a well-labelled fish, save it, '
      + 'and click <b>Use as example</b> above the photograph.';
    return;
  }
  if(!refAnnot.complete){return;}
  const W=rcv.width=rcv.clientWidth, H=rcv.height=rcv.clientHeight;
  rctx.setTransform(1,0,0,1,0,0); rctx.fillStyle=VIEWER_BG; rctx.fillRect(0,0,W,H);
  const reg = refMode==='zoom' ? refRegionFor(activeTask) : null;
  const lbl=$('#reflabel');
  if(reg){ // zoomed focus on the landmark or fin
    // Fit the region to the panel, preserving aspect, and never magnify past 1:1 —
    // beyond that there is no more detail in the file, only bigger pixels.
    const fitScale=Math.min(W/reg.w, H/reg.h);
    const zoom=Math.min(fitScale, 1);
    const sw=W/zoom, sh=H/zoom;
    // The window may not run off the photograph. Browsers disagree about a source
    // rectangle that does: Chromium draws only the part inside, Safari stretches
    // that part over the whole panel. eye_anterior sits 268 px from the left edge,
    // so Safari drew the head 1.25x too wide and the crosshair, placed for an
    // unstretched image, landed on the middle of the eye. Sliding the window back
    // inside keeps the picture true in both; the crosshair moves off-centre instead.
    const IW=refBase.naturalWidth||refData.w, IH=refBase.naturalHeight||refData.h;
    const inside=(c,span,full)=> span>=full ? (full-span)/2 : Math.min(Math.max(c-span/2,0), full-span);
    const sx=inside(reg.cx,sw,IW), sy=inside(reg.cy,sh,IH);
    // Smooth when upscaling; nearest-neighbour only helps at or below 1:1.
    rctx.imageSmoothingEnabled = zoom < 1 ? true : false;
    rctx.imageSmoothingQuality = 'high';
    // Only a window larger than the whole photograph can still overhang it; draw
    // just the overlap, where it belongs, and leave the rest dark.
    const x0=Math.max(sx,0), y0=Math.max(sy,0), x1=Math.min(sx+sw,IW), y1=Math.min(sy+sh,IH);
    if(x1>x0 && y1>y0)
      rctx.drawImage(refBase, x0,y0, x1-x0,y1-y0, (x0-sx)*zoom,(y0-sy)*zoom, (x1-x0)*zoom,(y1-y0)*zoom);
    const pt=[reg.cx, reg.cy];
    const cx=(pt[0]-sx)*zoom, cy=(pt[1]-sy)*zoom;
    if(activeTask.kind==='polygon'){
      // A crosshair on a fin's centroid says nothing useful. Draw the traced
      // outline: that is the convention the annotator is being asked to copy.
      const v=refData.polygons[activeTask.name];
      rctx.beginPath();
      v.forEach((p,i)=>{ const x=(p[0]-sx)*zoom, y=(p[1]-sy)*zoom;
        i?rctx.lineTo(x,y):rctx.moveTo(x,y); });
      rctx.closePath();
      rctx.strokeStyle='#4aa3ff'; rctx.lineWidth=2; rctx.stroke();
      rctx.fillStyle='#4aa3ff22'; rctx.fill();
      lbl.innerHTML=`<b>${activeTask.name}</b> — ${v.length} vertices on the example`;
    } else {
      rctx.beginPath();rctx.arc(cx,cy,7,0,7);rctx.strokeStyle='#ff5d6c';rctx.lineWidth=2;rctx.stroke();
      rctx.beginPath();rctx.moveTo(cx-14,cy);rctx.lineTo(cx+14,cy);rctx.moveTo(cx,cy-14);rctx.lineTo(cx,cy+14);
      rctx.strokeStyle='#ff5d6c88';rctx.stroke();
      lbl.innerHTML=`<b>${activeTask.name}</b> — where it goes on the example`;
    }
  } else { // overview
    const s=Math.min(W/refAnnot.naturalWidth,H/refAnnot.naturalHeight);
    const dw=refAnnot.naturalWidth*s, dh=refAnnot.naturalHeight*s;
    rctx.drawImage(refAnnot,(W-dw)/2,(H-dh)/2,dw,dh);
    const who=(refData&&refData.specimen||'').replace('Salvelinus_fontinalis_','')||'example';
    lbl.innerHTML = activeTask ? `Pick <b>overview→zoom</b> to focus on <b>${activeTask.name}</b>`
      : `Annotated example (${who}). Select a landmark + Zoom to focus.`;
  }
}

setRefBig(localStorage.getItem('calipr_ref_big')==='1');

function reviewed(name){          // the human MOVED this point
  if(pred.conf[name]===undefined) return;
  const from=pred.orig[name], to=(model[view].keypoints||{})[name];
  if(from && to){
    pred.corrected[name]={from:[from[0],from[1]], to:[to[0],to[1]],
                          px:+Math.hypot(to[0]-from[0], to[1]-from[1]).toFixed(1),
                          conf:pred.conf[name]};
  }
  pred.accepted.delete(name);
  delete pred.conf[name]; pred.low.delete(name); renderAutoStat();
}
// The next predicted point still waiting for a look: the order of the list on
// screen, after the one in hand, wrapping round so nothing is stranded above.
// Reviewed points, the ruler and outlines are passed over, so each A lands
// somewhere it can act. Fin landmarks are walked like the rest -- they used to be
// skipped, which made A stop dead after the peduncle, since everything left is a
// fin. They are the model's weakest points, so the toast names the fin.
function nextPending(fromName){
  const all=taskOrder().filter(([k])=>k==='keypoint').map(([,it])=>it.name);
  const pending=all.filter(n=>pred.conf[n]!==undefined);
  if(!pending.length) return null;
  const at=all.indexOf(fromName);
  return pending.find(n=>all.indexOf(n)>at) || pending[0];
}
// A point that is gone has no prediction to review: clearing one has to take its
// confidence, its place in the A walk and its accepted/corrected record with it.
// Otherwise the row keeps showing a confidence for a landmark that is not there,
// A walks to it and "accepts" nothing, and the save records it as reviewed.
function forgetPrediction(name){
  if(!pred.model) return false;
  const had = pred.conf[name]!==undefined || pred.accepted.has(name)
              || pred.corrected[name]!==undefined || pred.polys.has(name);
  delete pred.conf[name]; delete pred.orig[name]; delete pred.corrected[name];
  pred.low.delete(name); pred.accepted.delete(name); pred.polys.delete(name);
  delete (pred.dropped||{})[name];
  return had;
}
function acceptPoint(name){       // the human LOOKED and agrees
  if(!name || pred.conf[name]===undefined) return false;
  pred.accepted.add(name);
  delete pred.conf[name]; pred.low.delete(name);
  // Accepting changes no coordinate, so nothing else here would write the
  // draft — and the confirmation would be lost on leaving the specimen.
  persistDraft();
  renderAutoStat(); buildTasks(); draw();
  return true;
}
// The blocks above the specimen list change height per fish -- the no-scale
// banner is a line taller than a scale readout, a ruler whose ticks disagree has
// a warning to print, and all of them empty while the next fish loads. #specWrap
// is flex:1 with its bottom pinned, so each change moves its top and the rows
// slide out from under the cursor.
//
// Each of those blocks keeps the tallest height it has needed so far. It is a
// high-water mark rather than a fixed reservation because the tallest case is a
// property of the study, not something to hard-code: a set whose rulers all
// read cleanly never pays for the warning, and one where they do not settles
// after the first few fish and then holds still. It only ever grows, so a block
// emptying while the next fish loads no longer collapses at all.
const _floor = new WeakMap(), _shown = new WeakMap();
function reserve(el){
  if(!el) return;
  // Clearing the floor to measure forces a synchronous layout, and this runs
  // from updateCalRead, which runs on every point placed. Identical content
  // cannot have a different height, so the common case does no work at all.
  const now = el.innerHTML;
  if(_shown.get(el) === now) return;
  _shown.set(el, now);
  el.style.minHeight = '';                       // measure the content, not the floor
  const natural = el.getBoundingClientRect().height;
  const h = Math.max(natural, _floor.get(el) || 0);
  _floor.set(el, h);
  if(h > 0) el.style.minHeight = h + 'px';
}

function renderAutoStat(){
  const el=$('#autostat'); if(!el) return;
  if(!pred.model){ el.textContent=''; return; }
  const n=unreviewed(), nc=Object.keys(pred.corrected).length, na=pred.accepted.size;
  const tally=`<span style="color:var(--good)">${na} accepted</span> · `
            + `<span style="color:var(--kp)">${nc} corrected</span>`
            + (n?` · ${n} unreviewed`:'')
            + (pred.polys.size?`<br><span style="color:var(--good)">`
               + `${[...pred.polys].join(', ')}</span> outlined by the model`:'');
  const dropped=Object.entries(pred.dropped||{});
  // A landmark the model placed somewhere a fish cannot have it is not shown at
  // all, so without this the labeller sees a gap and no reason for it.
  const why = (pred.frameWarning
      ? `<br><b style="color:var(--kp)">${pred.frameWarning}</b>` : '')
    + (dropped.length ? `<br><b>${dropped.length} dropped as impossible:</b><br>`
        + dropped.map(([nm,r])=>{
            // Entries cached before the reason carried a confidence are plain
            // strings; both shapes have to render.
            const why = (r && r.why) || r;
            const c = r && r.confidence;
            const sure = (c==null) ? '' : ` — the model was ${c.toFixed(2)} sure`;
            return `<span style="color:var(--mut)">${nm} — ${why}${sure}</span>`;
          }).join('<br>') : '');
  if(!n){ el.innerHTML = tally + why + '<br>All points reviewed.'; return; }
  const low=[...pred.low];
  el.innerHTML = tally
    + (low.length ? `<br><b>check ${low.length}:</b> ${low.slice(0,4).join(', ')}`
                    + (low.length>4?` +${low.length-4}`:'') : '')
    + why
    + `<br><span style="color:var(--mut)">A = accept · drag = correct</span>`;
}

// A view the batch already predicted opens with those points in place, the same
// way the lateral view does. Only on a view with nothing of yours on it -- never
// over a draft, a saved label or a prediction already applied -- and nothing is
// written just by looking.
async function applyCachedPrediction(v){
  const s=cur;
  if(!s || v!=='frontal' || !s.predicted_frontal || !model) return;
  if(predBy[v].model || Object.keys(model[v].keypoints).length) return;
  try{
    const r=await api('/api/predict/'+encodeURIComponent(s.id)+dsq()+'&view='+v);
    if(!r || !r.ok || cur!==s || view!==v) return;                 // a later click wins
    if(predBy[v].model || Object.keys(model[v].keypoints).length) return;
    applyPrediction(r, v);
    buildTasks(); renderAutoStat(); draw();
  }catch(e){}
}
// Put a prediction onto the open fish as unreviewed model output. Shared by the
// Auto-label button and by opening a fish a batch already predicted, so both
// arrive identically -- same colouring, same review tracking, same exclusion from
// training until a person accepts or moves each point.
// ``fill`` places only what is not already there. A landmark a person placed is
// evidence; a predicted one is a suggestion, and a suggestion must never quietly
// replace evidence. Nothing here writes to disk either way -- a filled point is a
// prediction to review, and reaches a sidecar only when Save is pressed.
function applyPrediction(r, v='lateral', fill=false){
  const p=blankPred();
  Object.assign(p, {conf:r.confidence||{}, model:r.model||null,
        low:new Set(r.low_confidence||[]),
        dropped:r.implausible||{}, frameWarning:r.frame_warning||null,
        at:new Date().toISOString()});
  // An outline already there, that the model did not draw, is somebody's work.
  // A fin takes twenty clicks to trace; replacing one with a prediction because
  // Auto-label was pressed again would be the single most expensive thing this
  // button could do. The model's outline is a starting point for a fin nobody
  // has traced, never a replacement for one somebody has.
  const kept=[];
  for(const [nm,poly] of Object.entries(r.polygons||{})){
    if(!Array.isArray(poly) || poly.length<3) continue;
    const there=model[v].polygons[nm];
    if(there && there.length>=3 && !predBy[v].polys.has(nm)){ kept.push(nm); continue; }
    model[v].polygons[nm]=poly.map(q=>[Math.round(q[0]),Math.round(q[1])]);
    p.polys.add(nm);
  }
  if(kept.length) toast('Kept your outline of '+kept.join(', '));
  let filled=0;
  for(const [nm,pt] of Object.entries(r.keypoints||{})){
    if(fill && model[v].keypoints[nm]!==undefined) continue;   // yours stays
    const q=[Math.round(pt[0]),Math.round(pt[1])];
    model[v].keypoints[nm]=q;
    p.orig[nm]=[q[0],q[1]];           // frozen: the correction is measured from here
    filled++;
  }
  // The record has to cover what was actually placed, or A would walk points the
  // model never put down and the sidecar would claim them as reviewed.
  if(fill){
    const placed=new Set(Object.keys(p.orig));
    p.conf=Object.fromEntries(Object.entries(p.conf).filter(([n])=>placed.has(n)));
    p.low=new Set([...p.low].filter(n=>placed.has(n)));
    // Carry forward what an earlier prediction recorded about the points that
    // were already there, so reopening a filled fish still shows both.
    const was=predBy[v];
    if(was && was.model){
      p.accepted=new Set(was.accepted); p.corrected={...was.corrected};
      for(const [n,c] of Object.entries(was.conf)) if(!(n in p.conf)) p.conf[n]=c;
      for(const [n,o] of Object.entries(was.orig)) if(!(n in p.orig)) p.orig[n]=o;
      was.polys.forEach(n=>p.polys.add(n));
    }
  }
  predBy[v]=p;
  if(v===view) pred=p;
  return fill ? filled : Object.keys(r.keypoints||{}).length;
}
$('#autolabel').onclick=async()=>{
  if(!cur){ toast('Pick a specimen first'); return; }
  await refreshAuth();
  if(AUTH.required && !AUTH.unlocked){ if(!await unlock()) return; }
  // The view and fish at the click: the answer is applied to those even if the
  // labeller has moved on by the time it arrives.
  const s=cur, v=view;
  // With points already placed, filling the gaps is the safe reading of the
  // button and is what it offers first: a landmark somebody placed is evidence,
  // and the model's is a suggestion. Overwriting is still available, unticked.
  const placed=Object.keys(model[v].keypoints).length;
  let fill=false;
  if(placed){
    const r=await askCheck(
      `${placed} landmark(s) are already placed on this specimen's ${v} view.`,
      'Only fill the ones that are missing — keep every point I placed', true);
    if(!r) return;
    fill=r.checked;
  }
  const btn=$('#autolabel'); const was=btn.textContent;
  btn.disabled=true; btn.textContent='Predicting…';
  $('#autostat').textContent='running the model (first run loads it, ~5s)…';
  try{
    const r=await api('/api/predict/'+encodeURIComponent(s.id)+dsq()
                      +(v==='frontal'?'&view=frontal':''));
    if(cur!==s){ return; }                 // another fish was opened meanwhile
    if(!r.ok){ renderAutoStat();
               await tell('Auto-label is not available.\n\n'+(r.error||'The model did not answer.'));
               return; }
    // A server started before frontal Auto-label existed ignores the view and
    // answers with lateral landmarks, which would land on the frontal image.
    if((r.view||'lateral')!==v){ renderAutoStat();
      await tell(`The labeler server is older than this page and cannot auto-label the `
        + `${v} view. Restart it (Ctrl-C, then run it again) and reload. Nothing was placed.`);
      return; }
    const n=applyPrediction(r, v, fill);
    if(fill && !n){ renderAutoStat();
      toast('Nothing to fill — every landmark the model knows is already placed');
      return; }
    persistDraft();
    // Send the labeller straight to the least trustworthy point rather than
    // making them hunt for it.
    const first=(r.low_confidence||[]).find(n2=>pred.conf[n2]!==undefined);
    if(first && view===v) pickByName('keypoint',first);
    buildTasks(); renderAutoStat(); draw();
    const nlow=(r.low_confidence||[]).length;
    // A cached result reports 0.0s, which is falsy — say "cached" rather than "?".
    const when = r.cached ? 'from cache' : `in ${(r.elapsed ?? 0).toFixed
      ? (r.elapsed ?? 0).toFixed(1) : r.elapsed}s`;
    const ndrop=Object.keys(r.implausible||{}).length;
    toast(`${Object.keys(r.keypoints||{}).length} placed ${when} — `
          + (nlow?`${nlow} to check`:'all confident')
          + (ndrop?` · ${ndrop} dropped as impossible`:''));
  }catch(e){ toast('Auto-label failed: '+e); $('#autostat').textContent=''; }
  finally{ btn.disabled=false; btn.textContent=was; }
};

    specQuery=box.value; sel=0; renderSpecList(); renderKey(); box.focus();
  }

  });
  box.addEventListener('focus',renderKey);
  box.addEventListener('blur',()=>setTimeout(()=>key.classList.remove('on'),120));
  box.addEventListener('keydown',e=>{

    if(open && (e.key==='ArrowDown'||e.key==='ArrowUp')){
      e.preventDefault(); sel=(sel+(e.key==='ArrowDown'?1:rows.length-1))%rows.length; renderKey(); return;
    }

    if(!/(^|\s)\/\S*$/.test(box.value)) box.value=(box.value.trim()?box.value.trim()+' ':'')+'/';
    box.focus(); renderKey();

})();
// ---- adding photographs ----------------------------------------------------
// Two ways in, because neither covers everyone: a folder picker for people who
// expect a dialog, and drag-and-drop for people who expect to drag. Dropping a
// FOLDER is the case that matters — a collaborator with 200 photographs should
// not have to select them all in a list box.
const IMG_RE=/\.(jpe?g|png|tiff?)$/i;

// Subfolder names are meaningful — a folder per site or per collection event —
// so they are carried into the filename rather than dropped. The top-level
// folder the user dragged is skipped: it is the container they chose, the
// analogue of the dataset, and prefixing every file with "photos_" is noise.
function prefixed(name, parts){
  const p=parts.filter(Boolean);
  return p.length ? p.join("_") + "_" + name : name;
}

async function walkEntry(entry, out, depth=0, parts=[]){
  if(!entry || depth>8) return;                 // depth cap: symlink loops
  if(entry.isFile){
    await new Promise(res=>entry.file(f=>{
      if(IMG_RE.test(f.name)){
        const nm=prefixed(f.name, parts);
        out.push(nm===f.name ? f : new File([f], nm, {type:f.type}));
      }
      res();
    }, ()=>res()));
    return;
  }
  if(entry.isDirectory){
    const reader=entry.createReader();
    // readEntries returns at most ~100 per call; a folder of 200 photographs
    // silently truncates unless it is drained in a loop.
    for(;;){
      const batch=await new Promise(res=>reader.readEntries(res,()=>res([])));
      if(!batch.length) break;
      // depth 0 is the folder that was dropped; its name is not carried.
      const next = depth===0 ? parts : [...parts, entry.name];
      for(const e of batch) await walkEntry(e, out, depth+1, next);
    }
  }
}

async function uploadFiles(files){
  files=[...files].filter(f=>IMG_RE.test(f.name));
  if(!files.length){ toast('No images in that selection'); return; }
  // A study that keeps one photograph per fish has one place to put a photo:
  // the frame itself, which is both views. Adding to "frontal" would make a
  // second image of a fish that is meant to have one.
  const whole0 = !!(SCHEMA && SCHEMA.single_photo);
  const view = (!whole0 && $('#viewPick').value==='frontal') ? 'frontal' : 'lateral';
  const msg0=`Add ${files.length} photograph(s) to “${dataset}”${whole0?'':` (${view})`}?\n\n`+
             (whole0 ? `One photograph per fish, whole: the head-on view is the mirror in `
                     + `the same frame, and the frontal tab zooms to it.`
                     : `They are copied into the dataset. Nothing is overwritten.`);
  // A photograph that holds both views is split on the server. Offered only for
  // lateral uploads, and remembered per study, because it is a property of the
  // rig: either every photo from it has the mirror or none does.
  let split=false;
  if(whole0){ if(!await ask(msg0)) return; }
  else if(view==='lateral'){
    const key='calipr_split_'+dataset;
    let prev=false; try{ prev=localStorage.getItem(key)==='1'; }catch(e){}
    const r=await askCheck(msg0,
      'Each photo also shows the head-on view in a mirror on the left — split it into '
      + 'a lateral and a frontal image. The original is kept.', prev);
    if(!r) return;
    split=r.checked;
    try{ localStorage.setItem(key, split?'1':''); }catch(e){}
  } else if(!await ask(msg0)) return;
  let added=0, dup=0, failed=[], splitN=0, whole=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    progress(i, files.length, `adding ${i+1}/${files.length} — ${f.name}`);
    try{
      const hdr={'X-Filename':encodeURIComponent(f.name), 'X-View':view};
      if(split) hdr['X-Split']='mirror';
      const r=await fetch('/api/upload'+dsq(), {method:'POST', headers:hdr, body:f});
      const j=await r.json().catch(()=>({}));
      if(j.ok){
        if(j.status==='duplicate') dup++; else added++;
        if(j.status==='split') splitN++;
        if(j.status==='stored_whole') whole.push(`${f.name}: ${j.reason}`);
      }
      else failed.push(`${f.name}: ${j.error||r.status}`);
    }catch(e){ failed.push(`${f.name}: ${e}`); }
  }
  progressDone(failed.length ? `${failed.length} could not be added` : '');
  await refreshDatasets();     // the dropdown's image count is now wrong otherwise
  await loadSpecs();
  let msg=`Added ${added}`;
  if(split) msg+=` — ${splitN} split into lateral and frontal`;
  if(dup) msg+=`, ${dup} already present`;
  if(failed.length) msg+=`, ${failed.length} failed`;
  toast(msg);
  if(whole.length) await tell(
    `${whole.length} photograph(s) were NOT split, because the mirror edge was not where a `
    + `mirror can be. Each is stored whole as its lateral image, and its original is kept `
    + `under originals/.\n\n` + whole.slice(0,12).join('\n')
    + (whole.length>12?`\n…and ${whole.length-12} more`:''));
  if(failed.length) tell('These were not added:\n\n'+failed.slice(0,12).join('\n')
    + (failed.length>12?`\n…and ${failed.length-12} more`:''));
}

// Predict every unlabelled specimen up front. The results are cached server-side
// in sidecars_auto/, so the review pass afterwards opens each fish instantly
// instead of waiting a second per specimen. Nothing here writes a label: a
// prediction still only becomes data when a human saves it.
let batchRunning=false, batchCancel=false;

// Status line plus hairline bar for the long loops. ``finished`` is work that has
// completed -- not the item in flight -- so the bar never claims progress early.
function progress(finished, total, label){
  const el=$('#uprog'); el.classList.add('on');
  el.querySelector('.ptext').textContent=label;
  el.querySelector('.pfill').style.width=(total ? 100*finished/total : 0)+'%';
}
function progressDone(message=''){
  const el=$('#uprog'), fill=el.querySelector('.pfill');
  fill.style.width='100%';
  // Let the bar visibly reach the end before it goes, or a fast finish just
  // vanishes and looks like an interruption.
  setTimeout(()=>{ el.classList.remove('on'); fill.style.width='0';
                   el.querySelector('.ptext').textContent=message; }, 450);
}
