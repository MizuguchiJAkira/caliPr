      if(batchCancel) break;
      progress(done+failed, todo.length,
               `predicting ${done+failed+1}/${todo.length} — ${shortId(sp.id)} ${v}`);
      try{
        const r=await api('/api/predict/'+encodeURIComponent(sp.id)+dsq()
                          +(v==='frontal'?'&view=frontal':''));
        if(r.ok) done++;
        else { failed++; if(r.locked){ toast('Locked — stopping'); break; } }
      }catch(e){ failed++; }
    }
  } finally {
    batchRunning=false;
    btn.textContent=label;
    progressDone();
  }
  toast(batchCancel ? `Stopped after ${done}`
        : `Predicted ${done}${failed?`, ${failed} failed`:''} — open any of them`);
  // Surface the result without a reload: badges on every predicted fish, and the
  // fish that was open during the batch picks up its own points instead of
  // sitting there empty -- which is exactly what made the batch look like it had
  // done nothing. Only if you had not started on it.
  await loadSpecs();
  if(cur && !cur.labeled && !loadDraft(cur.id)
     && !Object.keys(model.lateral.keypoints).length){
    const fresh=SPECS.find(x=>x.id===cur.id);
    if(fresh && fresh.predicted) await selectSpec(fresh);
  }
};

// What to do with whatever the picker returns. Set synchronously, read when the
// files arrive — the work between the two cannot happen before the dialog opens.
let pendingUpload={mode:'existing', dataset:null};
function openFolderPicker(intent){
  pendingUpload=intent;
  $('#addfolder').click();          // must stay in the click's own tick
}

$('#tbNewStudy').onclick=()=>openFolderPicker({mode:'new'});
$('#tbAddPhotos').onclick=()=>$('#addimgs').click();

$('#addimgs').onchange=e=>{
  pendingUpload={mode:'existing', dataset:null};
  uploadFiles(e.target.files); e.target.value='';
};
$('#addfolder').onchange=async e=>{
  const picked=[...e.target.files];
  e.target.value='';
  const intent=pendingUpload;
  pendingUpload={mode:'existing', dataset:null};
  if(!picked.length) return;

  const files=picked.map(f=>{
    const rel=(f.webkitRelativePath||'').split('/').slice(1,-1);  // drop top folder + file
    const nm=prefixed(f.name, rel);
    return nm===f.name ? f : new File([f], nm, {type:f.type});
  });

  if(intent.mode==='new'){
    // The folder already has a name, so use it rather than asking twice. The
    // prompt is pre-filled and editable, not a blank box.
    const top=(picked[0].webkitRelativePath||'').split('/')[0] || '';
    const body=await nameNewStudy('Name for this study — a folder under data/ with its own '
      + 'landmarks and its own exports.', top);
    if(!body) return;
    const r=await api('/api/dataset/new',{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok){ toast(r.error||'could not create'); return; }
    await refreshDatasets();
    await pickDataset(r.name);
  } else if(intent.dataset && intent.dataset!==dataset){
    await pickDataset(intent.dataset);
  }
  uploadFiles(files);
};

(function wireDrop(){
  const zone=$('#dropzone'), where=$('#dropwhere');
  let depth=0;                       // dragenter/leave fire per child element
  window.addEventListener('dragenter',e=>{
    if(!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault(); depth++;
    where.textContent=`into “${dataset}” · ${$('#viewPick').value}`;
    zone.classList.add('on');
  });
  window.addEventListener('dragover',e=>{
    if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault();
  });
  window.addEventListener('dragleave',e=>{
    if(--depth<=0){ depth=0; zone.classList.remove('on'); }
  });
  window.addEventListener('drop',async e=>{
    if(!e.dataTransfer) return;
    e.preventDefault(); depth=0; zone.classList.remove('on');
    const items=[...(e.dataTransfer.items||[])];
    const entries=items.map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
    if(entries.length){
      const out=[];
      for(const en of entries) await walkEntry(en, out);
      return uploadFiles(out);
    }
    uploadFiles(e.dataTransfer.files||[]);   // browsers without the entry API
  });
})();
// Make the open fish this study's example. Built from its SAVED landmarks, so an
// unsaved edit is not what gets shown to everyone as the convention.
$('#useExample').onclick=async()=>{
  if(!cur){ toast('Open a specimen first'); return; }
  const name=shortId(cur.id);
  if(!cur.labeled){ tell(`Save ${name} first: the example is made from its saved landmarks.`); return; }
  if($('#viewtab').classList.contains('dirty')
     && !await ask(`${name} has unsaved changes. The example is made from its saved landmarks, `
                   + `so those changes would not be in it.`, {ok:'Use the saved version'})) return;
  const prev = refOwn && refData && refData.specimen ? shortId(refData.specimen) : null;
  if(prev && prev!==name && !await ask(`Make ${name} the example for “${dataset}”? It replaces ${prev}.`,
                                       {ok:'Use as example'})) return;
  const r=await api('/api/reference'+dsq(), {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:cur.id})});
  if(!r.ok){ tell('Could not make the example:\n\n'+(r.error||'?')); return; }
  await loadRef(); setRefMin(false);
  toast(`${name} is now the example for ${dataset}`);
};

// Remove every specimen the search shows -- the way to clear out a study down to
// the photographs wanted, a filter at a time. Offered only while the search is
// narrowing the list, so the whole study is never one click away. One trash
// folder per batch, with a list of what went; typing the count is asked for when
// any of them carries saved labels.
var SHOWN=null;          // var: the list can draw before this line has run
function updateRemoveShown(list){
  SHOWN = list && list.length ? list : null;
  const b=$('#removeShown'); if(!b) return;
  b.hidden=!SHOWN;
  if(SHOWN) b.textContent=`Remove ${SHOWN.length}`;
}
$('#removeShown').onclick=async()=>{
  const list=(SHOWN||[]).slice(); if(!list.length) return;
  const n=list.length, labelled=list.filter(s=>s.labeled).length, q=$('#specsearch').value.trim();
  const msg=`Remove the ${n} specimen${n>1?'s':''} the search “${q}” shows from “${dataset}”?\n\n`
    + (labelled ? `${labelled} of them ${labelled>1?'have':'has'} saved labels, which go with ${labelled>1?'them':'it'}. ` : '')
    + `They are moved to data/.trash/ in one folder, with a list of what was removed — not deleted.`;
  if(labelled){
    const typed=await askText(msg+`\n\nType ${n} to confirm.`, '');
    if(typed===null) return;
    if(typed.trim()!==String(n)){ toast('Number did not match — nothing removed'); return; }
  } else if(!await ask(msg, {ok:`Remove ${n}`})) return;
  const r=await api('/api/specimen/remove'+dsq(), {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids:list.map(s=>s.id)})});
  if(!r.ok){ tell('Nothing removed:\n\n'+(r.error||'?')); return; }
  list.forEach(s=>clearDraft(s.id));
  const gone=new Set(list.map(s=>s.id)), wasOpen=cur && gone.has(cur.id);
  $('#specsearch').value='';
  await loadSpecs();
  try{ await refreshDatasets(); }catch(e){}
  if(wasOpen){
    if(SPECS.length) await selectSpec(SPECS[0]);
    else { cur=null; model=blankModel(); buildTasks(); showHint(); draw(); }
  }
  toast(`Removed ${n} — in ${r.moved_to}`);
};

// Remove the open photograph from the study. Moved to data/.trash/ with its
// labels and cached predictions, not deleted -- a wrong click is undone by
// moving the files back -- so it asks once, and says so when there are labels.
$('#removePhoto').onclick=async()=>{
  if(!cur){ toast('Open a specimen first'); return; }
  const s=cur, name=shortId(s.id), i=SPECS.findIndex(x=>x.id===s.id);
  const msg=`Remove ${name} from “${dataset}”?\n\n`
    + (s.labeled ? `Its saved labels go with it. ` : '')
    + `The photograph${s.labeled?' and labels are':' is'} moved to data/.trash/, not deleted: `
    + `move ${s.labeled?'them':'it'} back into the study to restore.`;
  if(!await ask(msg, {ok:'Remove'})) return;
  const r=await api('/api/specimen/remove'+dsq(), {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:s.id})});
  if(!r.ok){ tell('Not removed:\n\n'+(r.error||'?')); return; }
  clearDraft(s.id);
  await loadSpecs();
  try{ await refreshDatasets(); }catch(e){}
  const next=SPECS[Math.min(Math.max(i,0), SPECS.length-1)];
  if(next) await selectSpec(next);
  else { cur=null; model=blankModel(); buildTasks(); showHint(); draw(); }
  toast(`Removed ${name} — in ${r.moved_to}`);
};

$('#save').onclick=async()=>{
  if(!cur){toast('No specimen');return;}
  if(model._blocked && Object.keys(model._blocked).length){
    await tell(`Not saved. The labels already saved for ${shortId(cur.id)} do not fit this `
      + `photograph, and saving now would overwrite coordinates that can still be recovered. `
      + `Repair them first:\n\n  python scripts/realign_labels.py --fish ${cur.id}`);
    return;
  }
  // capture the "known span" field value even if it was left at its default
  const km=parseFloat($('#knownmm').value);
  if(!isNaN(km) && (model[view].ruler.a||model[view].ruler.b)) model[view].known_mm=km;
  syncCompromise();
  // A scale far from the rest of its lot multiplies every length on the fish by
  // the same factor, and nothing downstream can tell. The readout warns, but it
  // went unread three times in one evening, so saving asks too.
  const L=model.lateral;
  if(calMedian && L.ruler.a && L.ruler.b && L.known_mm>0 && !L.auto_ppm){
    const px=Math.hypot(L.ruler.b[0]-L.ruler.a[0], L.ruler.b[1]-L.ruler.a[1]), ppm=px/L.known_mm;
    if(ppm>calMedian*1.35 || ppm<calMedian*0.74){
      const fit=spanThatFits(px);
      if(!await ask(`The scale on ${shortId(cur.id)} reads ${ppm.toFixed(1)} px/mm; the rest of `
          + `its lot reads about ${calMedian.toFixed(1)}. Every length on this fish would be off `
          + `by ${Math.max(ppm/calMedian, calMedian/ppm).toFixed(1)}×.`
          + (fit && fit!==L.known_mm ? `\n\nThe two ruler points are about ${fit} mm apart, `
             + `not ${L.known_mm} — set "known span" to ${fit}.` : '')
          + `\n\nSave anyway?`, {ok:'Save anyway'})) return;
    }
  }
  const strain=(cur.id.match(/_([A-Z]{2,4})_\d+$/)||[])[1]||'';
  const out={fish_id:cur.id, metadata:{strain, source:'hand-labeled'}};
  const untouched=['lateral','frontal'].filter(v=>{
    const p=predBy[v], total=Object.keys(model[v].keypoints).length;
    return p.model && total>0 && Object.keys(p.conf).length>=total;
  });
  if(untouched.length){
    // Saving a prediction with nothing touched would launder model output
    // into the training set, where it teaches the model its own mistakes.
    if(!await ask(`Every ${untouched.join(' and ')} landmark here is still exactly `+
      `where the model put it — nothing has been checked.\n\nSaving now records `+
      `this as a hand label and it WILL be used for training. Save anyway?`)) return;
  }
  // Per-landmark provenance. The three states are kept apart deliberately:
  // a corrected point is independent evidence, an accepted one is a human
  // agreeing with a suggestion they were shown, and an unreviewed one is
  // nothing at all. Collapsing them would make the weakest look like the
  // strongest. Lateral keeps its original key; frontal has its own.
  // Only points that are actually on the fish: a landmark cleared while an older
  // draft still carried its prediction must not be saved as reviewed.
  const assistOf=(p,v)=>{
    const placed=n=>model[v].keypoints[n]!==undefined || model[v].polygons[n]!==undefined;
    return {
    model: p.model,
    accepted: [...p.accepted].filter(placed).sort(),
    corrected: Object.fromEntries(Object.entries(p.corrected).filter(([n])=>placed(n))),
    unreviewed: Object.keys(p.conf).filter(placed).sort(),
    // Kept so a reopened fish can still show which unreviewed points were unsure.
    unreviewed_confidence: Object.fromEntries(
      Object.entries(p.conf).filter(([n])=>placed(n)).sort()),
    // Outlines the model drew and the human left as-is. Same caveat as an
    // accepted point: agreement with a suggestion, not an independent trace.
    polygons_from_model: [...p.polys].filter(placed).sort(),
    predicted_at: p.at || new Date().toISOString(),
  };};
  if(predBy.lateral.model){
    out.metadata.assist=assistOf(predBy.lateral,'lateral');
    out.metadata.unreviewed_predictions=out.metadata.assist.unreviewed;
  }
  if(predBy.frontal.model) out.metadata.assist_frontal=assistOf(predBy.frontal,'frontal');
  const by=predBy.lateral.model||predBy.frontal.model;
  if(by) out.metadata.assisted_by=by;
  if(model.data_note) out.metadata.data_note=model.data_note;
  if(model.exclude&&model.exclude.length) out.metadata.exclude_traits=model.exclude;
  for(const v of ['lateral','frontal']){
    const m=model[v]; const has=Object.keys(m.keypoints).length||Object.keys(m.polygons).length;
    if(!has) continue;
    const blk={}; if(Object.keys(m.polygons).length)blk.polygons=m.polygons;
    blk.keypoints=m.keypoints;
    if(m.auto_ppm)
      blk.calibration={mode:'ticks',px_per_mm:m.auto_ppm,notes:m.auto_notes||'ruler mm-tick autocalibration'};
    else if(m.ruler.a&&m.ruler.b&&m.known_mm)
      blk.calibration={mode:'manual',point_a:m.ruler.a,point_b:m.ruler.b,known_mm:m.known_mm,
        // Two points the ruler detector placed are not two points a person
        // clicked, and the file should not read as though they were.
        ...(m.ruler_from_ticks?{placed_by:'ruler-ticks'}:{})};
    else if(v==='lateral')
      // No ruler placed. Record that as an explicit scale-free calibration rather
      // than omitting the block: a missing calibration is rejected downstream, so
      // the landmarks would be stranded. Some series have no usable scale at all
      // (a specimen suspended mid-tank with the ruler on the near glass), and a
      // proportion study does not need one.
      blk.calibration={mode:'none',notes:'no scale reference placed'};
    out[v]=blk;
  }
  // The size of the image each view's labels were placed on; the server refuses
  // the save if the file on disk is no longer that size.
  // Only a server that checks these understands them. The page is re-read from
  // disk on every load, so it can be newer than a server still running old code;
  // sent to that server these would be written verbatim into the sidecar and
  // checked by nothing. The specimen list carries image sizes only when the
  // server does the checking.
  if(SPECS.some(x=>x.sizes!==undefined)){
    const placed={};
    for(const v of ['lateral','frontal'])
      if(out[v] && model._placed_on && model._placed_on[v]) placed[v]=model._placed_on[v];
    if(Object.keys(placed).length) out.metadata.placed_on=placed;
    if(model._base_mtime!==undefined) out.metadata.base_mtime=model._base_mtime;
  }
  const res=await api('/api/save'+dsq(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(out)});
  if(res.ok){
    clearDraft(cur.id);
    if(res.mtime!==undefined) model._base_mtime=res.mtime;   // later saves build on this one
    // Report what is still short rather than refusing the save: partial fin work
    // is worth keeping, it just must not read as finished.
    // A study whose scheme traces no fins has nothing to report here.
    const groups=finGroups();
    const short=groups.map(g=>({g,st:finState(g)})).filter(x=>!x.st.done);
    toast(!groups.length ? 'Saved '+res.saved
      : short.length
      ? `Saved ${res.saved} — still short: `+short.map(x=>`${x.g.fin} ${x.st.n}/${x.g.target}`).join(', ')
      : 'Saved '+res.saved+' — all four fins at target');
    loadSpecs();
  } else if(res.demo){
    toast('Demo mode — nothing was saved. Your labels on disk are untouched.');
  } else if(res.misaligned || res.conflict){
    await tell(res.error);
  } else toast('Error: '+(res.error||'?'));
};
boot();
</script>
